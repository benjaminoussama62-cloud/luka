<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="96" y1="84" x2="416" y2="428" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#60a5fa" flood-opacity="0.22"/>
    </filter>
    <radialGradient id="shine" cx="30%" cy="20%" r="75%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip">
      <rect x="64" y="64" width="384" height="384" rx="92" ry="92"/>
    </clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect x="64" y="64" width="384" height="384" rx="92" ry="92" fill="url(#g)"/>
    <g clip-path="url(#clip)">
      <circle cx="170" cy="150" r="230" fill="url(#shine)"/>
    </g>
    <rect x="64" y="64" width="384" height="384" rx="92" ry="92" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="10"/>

    <text
      x="256"
      y="332"
      text-anchor="middle"
      font-size="260"
      font-weight="800"
      font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"
      fill="#ffffff"
      letter-spacing="-10"
      style="paint-order: stroke; stroke: rgba(0,0,0,0.18); stroke-width: 10px;"
    >J</text>
  </g>
</svg>

