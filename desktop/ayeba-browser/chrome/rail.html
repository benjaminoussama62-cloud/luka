<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <style>
      :root {
        --ink: #eceef4;
        --muted: #7d8496;
        --accent: #7c5cff;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
        background: transparent;
        border-right: 1px solid rgba(255, 255, 255, 0.05);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 8px 0;
        user-select: none;
      }
      body.inprivate { background: linear-gradient(180deg, rgba(124, 92, 255, 0.16), transparent 30%); }

      .logo {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        margin-bottom: 14px;
        background: linear-gradient(135deg, #7c5cff 0%, #38bdf8 100%);
        color: #fff;
        font-weight: 800;
        font-size: 17px;
        letter-spacing: -0.02em;
        cursor: pointer;
        border: 0;
        box-shadow: 0 4px 14px rgba(124, 92, 255, 0.35);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      .logo:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(124, 92, 255, 0.5); }

      .stack { display: flex; flex-direction: column; gap: 4px; width: 100%; align-items: center; }
      .spacer { flex: 1; }

      .rail-btn {
        position: relative;
        width: 38px;
        height: 38px;
        border: 0;
        border-radius: 11px;
        background: transparent;
        color: var(--muted);
        display: grid;
        place-items: center;
        cursor: pointer;
        transition: background 0.14s ease, color 0.14s ease, transform 0.14s ease;
      }
      .rail-btn:hover { background: rgba(255, 255, 255, 0.08); color: var(--ink); }
      .rail-btn:active { transform: scale(0.92); }
      .rail-btn svg { width: 19px; height: 19px; }

      /* Tooltip latéral */
      .rail-btn::after {
        content: attr(data-tip);
        position: absolute;
        left: calc(100% + 10px);
        top: 50%;
        transform: translateY(-50%) translateX(-4px);
        background: #1a1d28;
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: var(--ink);
        font-size: 12px;
        font-weight: 500;
        padding: 5px 10px;
        border-radius: 7px;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.12s ease 0.25s, transform 0.12s ease 0.25s;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        z-index: 10;
      }
      .rail-btn:hover::after { opacity: 1; transform: translateY(-50%) translateX(0); }

      .sep {
        width: 22px;
        height: 1px;
        background: rgba(255, 255, 255, 0.09);
        margin: 5px 0;
      }
    </style>
  </head>
  <body>
    <button type="button" class="logo" id="logo" title="Accueil Ayeba">A</button>

    <div class="stack">
      <button type="button" class="rail-btn" data-act="tabs" data-tip="Onglets ouverts">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="4.5" width="14" height="11" rx="2"/><path d="M3 8h14M7 4.5V8"/></svg>
      </button>
      <button type="button" class="rail-btn" data-act="favorites" data-tip="Favoris">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M10 3.5l1.9 3.9 4.3.6-3.1 3 .7 4.2L10 13.3l-3.8 2 .7-4.3-3.1-3 4.3-.6z"/></svg>
      </button>
      <button type="button" class="rail-btn" data-act="history" data-tip="Historique">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="10" cy="10" r="7"/><path d="M10 6v4l2.8 1.8"/></svg>
      </button>
      <button type="button" class="rail-btn" data-act="downloads" data-tip="Téléchargements">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5V13M6 9.5l4 4 4-4M4 16.5h12"/></svg>
      </button>
      <button type="button" class="rail-btn" data-act="extensions" data-tip="Extensions">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3.5h4v3a2 2 0 1 1 0 4v3H8v-3a2 2 0 1 0 0-4z" transform="rotate(45 10 10)"/></svg>
      </button>
      <button type="button" class="rail-btn" data-act="passwords" data-tip="Mots de passe">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="4" y="8.5" width="12" height="8" rx="2"/><path d="M7 8.5V6.5a3 3 0 0 1 6 0v2"/></svg>
      </button>
    </div>

    <div class="spacer"></div>
    <div class="sep"></div>

    <button type="button" class="rail-btn" data-act="settings" data-tip="Paramètres">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="10" cy="10" r="2.6"/><path d="M10 3v2M10 15v2M3 10h2M15 10h2M5.2 5.2l1.4 1.4M13.4 13.4l1.4 1.4M14.8 5.2l-1.4 1.4M6.6 13.4l-1.4 1.4"/></svg>
    </button>

    <script>
      const api = window.ayebaBrowser;
      document.getElementById("logo").addEventListener("click", () => api.invoke("nav:home"));
      document.querySelectorAll("[data-act]").forEach((btn) => {
        btn.addEventListener("click", () => api.invoke("rail:action", btn.dataset.act));
      });
      api.onState((s) => {
        document.body.classList.toggle("inprivate", !!s?.isPrivate);
      });
    </script>
  </body>
</html>
