<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>AYEBA Rail</title>
<style>
  :root {
    --cyan: #00b4ff;
    --cyan-soft: #7df0ff;
    --orange: #e85d04;
    --ink: #f5f5f7;
    --muted: #9ca3af;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 52px; height: 100vh; overflow: hidden;
    font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    gap: 4px; padding: 10px 0;
    background:
      radial-gradient(140% 60% at 50% -10%, rgba(0, 180, 255, 0.1), transparent 55%),
      #05060a;
    border-right: 1px solid rgba(255,255,255,.07);
    color: var(--ink);
  }
  .logo {
    width: 34px; height: 34px; border: 0; border-radius: 11px;
    background:
      linear-gradient(160deg, #12141c, #0a0a0e);
    display: grid; place-items: center; cursor: pointer;
    margin-bottom: 8px;
    box-shadow: inset 0 0 0 1px rgba(0,180,255,.35), 0 2px 10px rgba(0,0,0,.5);
    transition: box-shadow .15s, transform .12s;
  }
  .logo:hover { box-shadow: inset 0 0 0 1px rgba(0,180,255,.65), 0 0 16px rgba(0,180,255,.35); transform: translateY(-1px); }
  .logo:active { transform: scale(.95); }
  .sep { width: 24px; height: 1px; background: rgba(255,255,255,.09); margin: 5px 0; }
  button.r {
    position: relative;
    width: 38px; height: 38px; border: 0; border-radius: 11px;
    background: transparent; color: var(--muted);
    display: grid; place-items: center; cursor: pointer;
    transition: background .14s, color .14s, transform .1s;
  }
  button.r:hover { background: rgba(255,255,255,.07); color: var(--ink); }
  button.r:active { transform: scale(.92); }
  button.r.active {
    background: linear-gradient(135deg, rgba(125,240,255,.18), rgba(0,180,255,.14));
    color: var(--cyan-soft);
    box-shadow: inset 0 0 0 1px rgba(0,180,255,.3), 0 0 14px rgba(0,180,255,.15);
  }
  button.r.active::before {
    content: ""; position: absolute; left: -7px; top: 50%; transform: translateY(-50%);
    width: 3px; height: 16px; border-radius: 2px;
    background: linear-gradient(180deg, var(--cyan-soft), var(--cyan));
    box-shadow: 0 0 8px rgba(0,180,255,.6);
  }
  .spacer { flex: 1; }
  body.inprivate { background: radial-gradient(140% 60% at 50% -10%, rgba(232,93,4,.12), transparent 55%), #0d0a08; border-right-color: rgba(232,93,4,.25); }
  /* tooltip */
  [data-tip]::after {
    content: attr(data-tip);
    position: fixed; left: 56px; transform: translateY(-50%);
    margin-top: -19px;
    padding: 6px 11px; border-radius: 9px;
    background: rgba(13,16,24,.97); border: 1px solid rgba(125,240,255,.2);
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
    color: var(--ink); font-size: 12px; white-space: nowrap;
    opacity: 0; pointer-events: none; transition: opacity .12s;
    z-index: 99;
  }
  [data-tip]:hover::after { opacity: 1; }
</style>
</head>
<body>
  <button class="logo" data-act="home" data-tip="Ayeba" aria-label="Accueil Ayeba">
    <svg width="20" height="20" viewBox="0 0 512 512" aria-hidden="true">
      <defs>
        <linearGradient id="mA" x1="20%" y1="10%" x2="80%" y2="90%">
          <stop offset="0%" stop-color="#7df0ff"/>
          <stop offset="45%" stop-color="#00b4ff"/>
          <stop offset="100%" stop-color="#e85d04"/>
        </linearGradient>
      </defs>
      <path fill="url(#mA)" d="M256 96 L392 400 H332 L302 324 H210 L180 400 H120 L256 96 Z M228 268 H284 L256 196 Z"/>
    </svg>
  </button>
  <button class="r" data-act="tabs" data-tip="Onglets" aria-label="Onglets">
    <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="15" height="11" rx="2.5"/><path d="M2.5 8h15M7.5 4.5V8"/></svg>
  </button>
  <button class="r" data-act="favorites" data-tip="Favoris" aria-label="Favoris">
    <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M10 3.5l1.9 3.9 4.3.6-3.1 3 .7 4.2L10 13.3l-3.8 2 .7-4.3-3.1-3 4.3-.6z"/></svg>
  </button>
  <button class="r" data-act="history" data-tip="Historique" aria-label="Historique">
    <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="10" cy="10" r="7.2"/><path d="M10 6v4l2.8 1.7"/></svg>
  </button>
  <button class="r" data-act="downloads" data-tip="Téléchargements" aria-label="Téléchargements">
    <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5v8.5m0 0L6.8 8.8M10 12l3.2-3.2M4 15.5h12"/></svg>
  </button>
  <div class="sep"></div>
  <button class="r" data-act="extensions" data-tip="Extensions" aria-label="Extensions">
    <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3.5h4v3a1.6 1.6 0 103.2 0V3.5h1.3v5.3h-3a1.6 1.6 0 100 3.2h3v4.5h-5.3v-3a1.6 1.6 0 10-3.2 0v3H3.5V11h3a1.6 1.6 0 100-3.2h-3V3.5H8z"/></svg>
  </button>
  <button class="r" data-act="passwords" data-tip="Mots de passe" aria-label="Mots de passe">
    <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7.5" cy="8" r="3.6"/><path d="M10.2 10.6L16 16.4M13.4 13.4l1.7-1.7M15 15l1.7-1.7"/></svg>
  </button>
  <div class="spacer"></div>
  <button class="r" data-act="settings" data-tip="Paramètres" aria-label="Paramètres">
    <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.8 4.8l1.4 1.4M13.8 13.8l1.4 1.4M15.2 4.8l-1.4 1.4M6.2 13.8l-1.4 1.4"/></svg>
  </button>
<script>
  const api = window.ayebaBrowser;
  document.querySelectorAll("button[data-act]").forEach((b) => {
    b.addEventListener("click", () => api.invoke("rail:action", b.dataset.act));
  });
  if (api && api.on) {
    api.on("rail:state", (s) => {
      document.body.classList.toggle("inprivate", !!s.inprivate);
    });
  }
</script>
</body>
</html>
