<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>AYEBA Rail</title>
<style>
  :root {
    --cyan: #00b4ff;
    --cyan-soft: #7df0ff;
    --orange: #e85d04;
    --ink: #f5f5f7;
    --muted: #9ca3af;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 52px; height: 100vh; overflow: hidden;
    font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    gap: 3px; padding: 12px 0;
    background: #000;
    border-right: 1px solid rgba(255,255,255,.08);
    color: var(--ink);
  }
  .sep { width: 22px; height: 1px; background: rgba(255,255,255,.08); margin: 6px 0; }
  button.r {
    position: relative;
    width: 38px; height: 38px; border: 1px solid transparent; border-radius: 4px;
    background: transparent; color: var(--muted);
    display: grid; place-items: center; cursor: pointer;
    transition: background .3s cubic-bezier(.22,1,.36,1), color .3s, border-color .3s, transform .1s;
  }
  button.r:hover { background: rgba(232,93,4,.14); border-color: rgba(232,93,4,.35); color: var(--ink); }
  button.r:active { transform: scale(.93); }
  button.r.active {
    background: rgba(232,93,4,.14);
    border-color: var(--orange);
    color: var(--orange);
  }
  button.r.active::before {
    content: ""; position: absolute; left: -7px; top: 50%; transform: translateY(-50%);
    width: 2.5px; height: 18px;
    background: var(--orange);
    box-shadow: 0 0 10px rgba(255,107,26,.55);
  }
  .dot {
    position: absolute; top: 6px; right: 6px;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--orange);
    box-shadow: 0 0 0 2px #000, 0 0 9px rgba(255,107,26,.8);
    display: none;
    animation: dl-pulse 1.3s ease infinite;
  }
  button.r.busy .dot { display: block; }
  @keyframes dl-pulse { 50% { opacity: .35; } }
  .spacer { flex: 1; }
  body.inprivate { background: #080402; border-right-color: rgba(232,93,4,.3); }
  /* tooltip — micro-label mono du site */
  [data-tip]::after {
    content: attr(data-tip);
    position: fixed; left: 56px; transform: translateY(-50%);
    margin-top: -19px;
    padding: 6px 11px; border-radius: 2px;
    background: rgba(8,8,10,.92); border: 1px solid rgba(255,255,255,.08);
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
    backdrop-filter: blur(24px);
    color: var(--ink);
    font-family: "Cascadia Mono", Consolas, ui-monospace, monospace;
    font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
    white-space: nowrap;
    opacity: 0; pointer-events: none; transition: opacity .15s;
    z-index: 99;
  }
  [data-tip]:hover::after { opacity: 1; }
</style>
</head>
<body>
  <button class="r" data-act="tabs" data-tip="Onglets" aria-label="Onglets">
    <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.5a2 2 0 012-2h8a2 2 0 012 2v7a2 2 0 01-2 2H6a2 2 0 01-2-2z"/><path d="M4 9.5h12M8.5 5.5v4"/></svg>
  </button>
  <button class="r" data-act="favorites" data-tip="Favoris" aria-label="Favoris">
    <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M10 3.6l1.87 3.8 4.2.6-3.04 2.95.72 4.15L10 13.1l-3.75 2-.72-4.16L2.5 8l4.2-.6z"/></svg>
  </button>
  <button class="r" data-act="history" data-tip="Historique" aria-label="Historique">
    <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 5.5A7.3 7.3 0 1110 17.3 7.3 7.3 0 014 13"/><path d="M4 3.5v2.5h2.5"/><path d="M10 6.8V10l2.6 1.6"/></svg>
  </button>
  <button class="r" data-act="downloads" data-tip="Téléchargements" aria-label="Téléchargements" id="railDl">
    <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5V12M6.6 8.8L10 12.2l3.4-3.4"/><path d="M4 14.5v1a1.5 1.5 0 001.5 1.5h9a1.5 1.5 0 001.5-1.5v-1"/></svg>
    <i class="dot"></i>
  </button>
  <div class="sep"></div>
  <button class="r" data-act="extensions" data-tip="Extensions" aria-label="Extensions">
    <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8.2 4.2a1.8 1.8 0 013.6 0V5h3a1 1 0 011 1v3.2h-.8a1.8 1.8 0 000 3.6h.8V16a1 1 0 01-1 1h-3.2v-.8a1.8 1.8 0 00-3.6 0v.8H4.8a1 1 0 01-1-1v-3.2h.8a1.8 1.8 0 000-3.6h-.8V6a1 1 0 011-1h3.4z"/></svg>
  </button>
  <button class="r" data-act="passwords" data-tip="Mots de passe" aria-label="Mots de passe">
    <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="7.5" r="3.7"/><path d="M10.1 10.1L16 16M13.4 12.9l1.8-1.8M15.2 14.7l1.6-1.6"/></svg>
  </button>
  <div class="sep"></div>
  <button class="r" data-act="mail" data-tip="Ayeba Mail" aria-label="Ayeba Mail">
    <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="2.8" y="4.5" width="14.4" height="11" rx="1.8"/><path d="M3.4 6.2L10 11l6.6-4.8"/></svg>
  </button>
  <div class="spacer"></div>
  <button class="r" data-act="settings" data-tip="Paramètres" aria-label="Paramètres">
    <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M3.5 6.5h13M3.5 13.5h13"/><circle cx="8" cy="6.5" r="1.9" fill="#0b0d14"/><circle cx="12.5" cy="13.5" r="1.9" fill="#0b0d14"/></svg>
  </button>
<script>
  const api = window.ayebaBrowser;
  document.querySelectorAll("button[data-act]").forEach((b) => {
    b.addEventListener("click", () => {
      const r = b.getBoundingClientRect();
      api.invoke("rail:action", { act: b.dataset.act, y: r.top + r.height / 2 });
    });
  });
  if (api && api.on) {
    api.on("rail:state", (s) => {
      document.body.classList.toggle("inprivate", !!(s && s.isPrivate));
      document.getElementById("railDl")?.classList.toggle("busy", !!(s && s.downloading));
    });
  }
</script>
</body>
</html>
