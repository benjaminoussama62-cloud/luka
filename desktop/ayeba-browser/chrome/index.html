<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: https:; connect-src 'self'" />
    <link rel="stylesheet" href="./chrome.css" />
  </head>
  <body>
    <div class="chrome-backdrop" id="chromeBackdrop" hidden></div>

    <div class="chrome-shell">
      <!-- Bandeau onglets Edge -->
      <div class="tabstrip">
        <div class="tabs" id="tabs" role="tablist"></div>
        <button type="button" class="icon-btn tab-add" id="btnNewTab" title="Nouvel onglet (Ctrl+T)" aria-label="Nouvel onglet">
          <svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
        </button>
      </div>

      <!-- Barre d'outils -->
      <div class="toolbar">
        <div class="nav-cluster">
          <button type="button" class="icon-btn" id="btnBack" title="Précédent" aria-label="Précédent">
            <svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" d="M10.5 3.5 6 8l4.5 4.5-.7.7L4.6 8l5.2-5.2z"/></svg>
          </button>
          <button type="button" class="icon-btn" id="btnForward" title="Suivant" aria-label="Suivant">
            <svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" d="m5.5 3.5 4.5 4.5-4.5 4.5.7.7L11.4 8 6.2 2.8z"/></svg>
          </button>
          <button type="button" class="icon-btn" id="btnReload" title="Actualiser (Ctrl+R)" aria-label="Actualiser">
            <svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" d="M8 2a6 6 0 0 0-5.2 3H1v2h3.5l1.2-2.1A4 4 0 1 1 8 12V10l3 3-3 3v-2a6 6 0 1 0-6-6z"/></svg>
          </button>
          <button type="button" class="icon-btn" id="btnHome" title="Accueil" aria-label="Accueil">
            <svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" d="M8 1.5 1.5 7.5V14h4v-4h5v4h4V7.5z"/></svg>
          </button>
        </div>

        <form class="omnibox" id="omniForm">
          <div class="omni-progress-track" id="omniProgress" hidden><div class="omni-progress-bar"></div></div>
          <span class="omni-leading" id="omniIcon" aria-hidden="true">
            <svg class="icon-search" width="15" height="15" viewBox="0 0 16 16"><path fill="currentColor" d="M7 2a5 5 0 1 1 0 10A5 5 0 0 1 7 2m0-1a6 6 0 1 0 3.6 10.8l3.4 3.4.7-.7-3.4-3.4A6 6 0 0 0 7 1"/></svg>
            <svg class="icon-lock" width="13" height="15" viewBox="0 0 12 14" hidden><path fill="currentColor" d="M6 0a3 3 0 0 0-3 3v2H2v9h8V5H9V3a3 3 0 0 0-3-3m1 5H5V3a1 1 0 1 1 2 0z"/></svg>
          </span>
          <input id="omni" type="text" spellcheck="false" autocomplete="off" placeholder="Rechercher ou entrer une adresse web" />
          <button type="button" class="omni-action" id="btnOmniFav" title="Ajouter aux favoris" aria-label="Favori">
            <svg width="14" height="14" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.2" d="M8 2.5 9.8 6l4 .6-2.9 2.8.7 4L8 11.8 4.4 13.4l.7-4L2.2 6.6l4-.6z"/></svg>
          </button>
        </form>

        <div class="actions-cluster">
          <button type="button" class="icon-btn" id="btnCollections" title="Favoris (Ctrl+Shift+O)" aria-label="Favoris">
            <svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" d="M2 3h12v2H2zm0 4h8v2H2zm0 4h10v2H2z"/></svg>
          </button>
          <button type="button" class="icon-btn" id="btnDownloads" title="Téléchargements (Ctrl+J)" aria-label="Téléchargements">
            <svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" d="M8 1v8.6l2.4-2.4.7.7L8 11.7 4.9 8.9l.7-.7L8 9.6V1zm-6 12v2h12v-2z"/></svg>
            <span class="badge-dot" id="downloadBadge" hidden></span>
          </button>
          <button type="button" class="icon-btn" id="btnExtensions" title="Extensions" aria-label="Extensions">
            <svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" d="M8 1a2.5 2.5 0 0 0-2.45 2h-.1A3.45 3.45 0 0 0 2 6.45v.1A2.5 2.5 0 0 0 4 9v.05A3.45 3.45 0 0 0 6.45 12h.1A2.5 2.5 0 0 0 9 14.5h.05A3.45 3.45 0 0 0 12.55 12h.1A2.5 2.5 0 0 0 15 9.55V9a3.45 3.45 0 0 0-2-3.1V5.45A2.5 2.5 0 0 0 10.5 3h-.05A3.45 3.45 0 0 0 8 1z"/></svg>
          </button>
          <span class="inprivate-badge" id="inprivateBadge" hidden>InPrivate</span>
          <button type="button" class="profile-orb" id="btnProfile" title="Profil" aria-label="Profil"><span>A</span></button>
          <button type="button" class="icon-btn menu-trigger" id="btnMenu" aria-haspopup="true" aria-expanded="false" aria-label="Paramètres et plus">
            <svg width="16" height="16" viewBox="0 0 16 16"><circle cx="3" cy="8" r="1.3" fill="currentColor"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/><circle cx="13" cy="8" r="1.3" fill="currentColor"/></svg>
          </button>
          <button type="button" class="copilot-btn" id="btnCopilot" title="Ayeba IA">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0078d4"/><stop offset="50%" stop-color="#8661c5"/><stop offset="100%" stop-color="#e85d04"/></linearGradient></defs><path fill="url(#cg)" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2m-1 15-4-4 1.41-1.41L11 14.17l6.59-6.59L19 9z"/></svg>
            <span>Conversation</span>
          </button>
        </div>
      </div>

      <!-- Barre des favoris (favicons) -->
      <div class="bookmarks" id="bookmarksBar">
        <button type="button" data-url="https://ayeba.app/ayebi"><img src="https://ayeba.app/favicon.ico" alt="" onerror="this.style.display='none'"/>Ayebi</button>
        <button type="button" data-url="https://ayeba.app"><img src="https://ayeba.app/favicon.ico" alt=""/>Ayeba</button>
        <button type="button" data-url="https://ayeba.app/marches"><img src="https://ayeba.app/favicon.ico" alt=""/>Marchés</button>
        <button type="button" data-url="https://youtube.com"><img src="https://www.youtube.com/favicon.ico" alt=""/>YouTube</button>
        <button type="button" data-url="https://github.com"><img src="https://github.com/favicon.ico" alt=""/>GitHub</button>
        <button type="button" data-url="https://jemsa.net"><img src="https://ayeba.app/brand/shortcuts/jemsa.svg" alt=""/>Jemsa</button>
        <button type="button" data-url="https://sombatekaonline.com"><img src="https://ayeba.app/brand/shortcuts/sombateka.png" alt=""/>Sombateka</button>
        <button type="button" data-url="https://omega-web.org"><img src="https://ayeba.app/brand/shortcuts/omega.png" alt=""/>Omega</button>
        <span class="bm-sep"></span>
        <button type="button" class="bm-other" id="btnAllBookmarks">Autres favoris</button>
      </div>
    </div>

    <!-- Menu principal Edge -->
    <nav class="flyout menu-flyout" id="menu" hidden aria-label="Menu">
      <button type="button" data-act="new-tab"><svg class="mi-svg" viewBox="0 0 16 16"><path fill="currentColor" d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.5"/></svg>Nouvel onglet<span class="shortcut">Ctrl+T</span></button>
      <button type="button" data-act="new-window"><svg class="mi-svg" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1" fill="none" stroke="currentColor"/></svg>Nouvelle fenêtre<span class="shortcut">Ctrl+N</span></button>
      <button type="button" data-act="new-private"><svg class="mi-svg" viewBox="0 0 16 16"><path fill="currentColor" d="M8 1a4 4 0 0 0-4 4v1H3v9h10V6h-1V5a4 4 0 0 0-4-4"/></svg>Nouvelle fenêtre InPrivate</button>
      <div class="flyout-sep"></div>
      <div class="zoom-row"><span>Zoom</span><div><button type="button" data-act="zoom-out">−</button><em id="zoomLabel">100%</em><button type="button" data-act="zoom-in">+</button></div></div>
      <div class="flyout-sep"></div>
      <button type="button" data-act="favorites"><svg class="mi-svg" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" d="M8 2.5 9.8 6l4 .6-2.9 2.8.7 4L8 11.8 4.4 13.4l.7-4L2.2 6.6l4-.6z"/></svg>Favoris<span class="shortcut">Ctrl+Shift+O</span></button>
      <button type="button" data-act="history"><svg class="mi-svg" viewBox="0 0 16 16"><path fill="currentColor" d="M8 2a6 6 0 1 0 6 6h-1.5a4.5 4.5 0 1 1-1.3-3.2L8 7V4l3 2"/></svg>Historique<span class="shortcut">Ctrl+H</span></button>
      <button type="button" data-act="tab-groups"><svg class="mi-svg" viewBox="0 0 16 16"><rect x="2" y="2" width="5" height="5" rx="1" fill="currentColor" opacity=".6"/><rect x="9" y="2" width="5" height="5" rx="1" fill="currentColor" opacity=".6"/><rect x="2" y="9" width="5" height="5" rx="1" fill="currentColor" opacity=".6"/></svg>Onglets ouverts</button>
      <button type="button" data-act="downloads"><svg class="mi-svg" viewBox="0 0 16 16"><path fill="currentColor" d="M8 1v8.6l2.4-2.4.7.7L8 11.7 4.9 8.9l.7-.7L8 9.6V1zm-6 12v2h12v-2z"/></svg>Téléchargements<span class="shortcut">Ctrl+J</span></button>
      <button type="button" data-act="extensions"><svg class="mi-svg" viewBox="0 0 16 16"><path fill="currentColor" d="M8 1a2.5 2.5 0 0 0-2.45 2h-.1A3.45 3.45 0 0 0 2 6.45v.1A2.5 2.5 0 0 0 4 9v.05A3.45 3.45 0 0 0 6.45 12h.1A2.5 2.5 0 0 0 9 14.5h.05A3.45 3.45 0 0 0 12.55 12h.1A2.5 2.5 0 0 0 15 9.55V9a3.45 3.45 0 0 0-2-3.1V5.45A2.5 2.5 0 0 0 10.5 3h-.05A3.45 3.45 0 0 0 8 1z"/></svg>Extensions</button>
      <button type="button" data-act="passwords"><svg class="mi-svg" viewBox="0 0 16 16"><path fill="currentColor" d="M6 0a3 3 0 0 0-3 3v2H2v9h8V5H9V3a3 3 0 0 0-3-3m1 5H5V3a1 1 0 1 1 2 0z"/></svg>Mots de passe</button>
      <div class="flyout-sep"></div>
      <button type="button" data-act="clear"><svg class="mi-svg" viewBox="0 0 16 16"><path fill="currentColor" d="M3 4h10v1H3zm1 2h8l-.8 8H4.8z"/></svg>Supprimer les données de navigation</button>
      <button type="button" data-act="print"><svg class="mi-svg" viewBox="0 0 16 16"><path fill="currentColor" d="M4 2h8v3H4zm-2 5h12v5H2zm2 5h8v2H4z"/></svg>Imprimer<span class="shortcut">Ctrl+P</span></button>
      <button type="button" data-act="screenshot"><svg class="mi-svg" viewBox="0 0 16 16"><rect x="2" y="4" width="12" height="9" rx="1" fill="none" stroke="currentColor"/><circle cx="8" cy="8.5" r="2" fill="currentColor"/></svg>Capture d'écran</button>
      <button type="button" data-act="find"><svg class="mi-svg" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4" fill="none" stroke="currentColor"/><path d="M10 10l3 3" stroke="currentColor"/></svg>Rechercher sur la page<span class="shortcut">Ctrl+F</span></button>
      <div class="flyout-sep"></div>
      <button type="button" data-act="settings"><svg class="mi-svg" viewBox="0 0 16 16"><path fill="currentColor" d="M8 1l1.2 2.5 2.7.4-2 1.9.5 2.7L8 7.5 5.6 8.5l.5-2.7-2-1.9 2.7-.4z"/></svg>Paramètres</button>
      <button type="button" data-act="ayebi"><svg class="mi-svg" viewBox="0 0 16 16"><text x="4" y="12" fill="currentColor" font-size="10" font-weight="700">A</text></svg>Ayebi</button>
      <button type="button" data-act="about"><svg class="mi-svg" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor"/><path d="M8 7v4M8 5h.01" stroke="currentColor"/></svg>À propos d'AYEBA</button>
    </nav>

    <!-- Profil Edge -->
    <div class="flyout profile-flyout" id="profileFlyout" hidden>
      <div class="profile-head">
        <div class="profile-orb lg"><span>A</span></div>
        <div><strong>Profil 1</strong><p>Non connecté</p></div>
      </div>
      <button type="button" class="flyout-cta" data-go="https://ayeba.app/compte">Se connecter</button>
      <div class="profile-sync">
        <span class="sync-label">Synchronisation</span>
        <button type="button" class="sync-account" data-go="https://ayeba.app/compte">Compte Ayeba</button>
      </div>
      <div class="flyout-sep"></div>
      <button type="button" data-go="https://ayeba.app/compte"><svg class="mi-svg sm" viewBox="0 0 16 16"><path fill="currentColor" d="M6 0a3 3 0 0 0-3 3v2H2v9h8V5H9V3a3 3 0 0 0-3-3m1 5H5V3a1 1 0 1 1 2 0z"/></svg>Mots de passe et remplissage auto</button>
      <button type="button" data-act="settings"><svg class="mi-svg sm" viewBox="0 0 16 16"><circle cx="8" cy="6" r="3" fill="none" stroke="currentColor"/><path d="M3 14c0-3 2.2-5 5-5s5 2 5 5" fill="none" stroke="currentColor"/></svg>Paramètres de profil</button>
      <button type="button" data-go="https://ayeba.app/ayebi"><svg class="mi-svg sm" viewBox="0 0 16 16"><text x="5" y="12" fill="currentColor" font-size="10" font-weight="700">A</text></svg>Ayebi · encyclopédie RDC</button>
      <button type="button" data-act="guest"><svg class="mi-svg sm" viewBox="0 0 16 16"><path fill="currentColor" d="M8 1a4 4 0 0 0-4 4v1H3v9h10V6h-1V5a4 4 0 0 0-4-4"/></svg>Naviguer en tant qu'invité</button>
      <div class="flyout-sep"></div>
      <div class="profile-list-label">Autres profils</div>
      <button type="button" class="profile-alt"><span class="profile-orb xs">R</span>rose</button>
      <button type="button" class="profile-add">+ Ajouter un profil</button>
    </div>

    <!-- Téléchargements Edge -->
    <div class="flyout downloads-flyout" id="downloadsFlyout" hidden>
      <header>
        <strong>Téléchargements</strong>
        <div class="dl-header-actions">
          <button type="button" class="linkish" id="downloadsOpenFolder">Ouvrir le dossier</button>
          <button type="button" class="linkish" id="downloadsClear">Effacer</button>
        </div>
      </header>
      <div class="flyout-body" id="downloadsBody"></div>
    </div>

    <!-- Favoris sidebar Edge -->
    <aside class="drawer favorites-drawer" id="favoritesDrawer" hidden>
      <header>
        <strong>Favoris</strong>
        <div class="drawer-tools">
          <button type="button" class="icon-btn sm" id="favSearch" title="Rechercher"><svg width="14" height="14" viewBox="0 0 16 16"><path fill="currentColor" d="M7 2a5 5 0 1 1 0 10A5 5 0 0 1 7 2m0-1a6 6 0 1 0 3.6 10.8l3.4 3.4.7-.7-3.4-3.4A6 6 0 0 0 7 1"/></svg></button>
          <button type="button" class="icon-btn sm" id="favAddFolder" title="Nouveau dossier">+</button>
          <button type="button" class="icon-btn sm" id="favoritesClose" title="Fermer">×</button>
        </div>
      </header>
      <div class="drawer-search" id="favSearchBox" hidden>
        <input type="text" id="favFilter" placeholder="Rechercher dans les favoris…" />
      </div>
      <div class="flyout-body" id="favoritesBody"></div>
    </aside>

    <!-- Panneau paramètres -->
    <div class="panel sheet" id="panel" hidden>
      <header><h3 id="panelTitle">Paramètres</h3><button type="button" class="icon-btn" id="panelClose">×</button></header>
      <div class="flyout-body" id="panelBody"></div>
    </div>

    <div class="findbar" id="findbar" hidden>
      <input id="findInput" type="text" placeholder="Rechercher sur la page…" />
      <span class="find-count" id="findCount"></span>
      <button type="button" id="findPrev">↑</button>
      <button type="button" id="findNext">↓</button>
      <button type="button" id="findClose">✕</button>
    </div>

    <script src="./chrome.js"></script>
  </body>
</html>
