<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: https:; connect-src 'self'" />
    <link rel="stylesheet" href="./chrome.css" />
  </head>
  <body>
    <div class="chrome-backdrop" id="chromeBackdrop" hidden></div>

    <header class="chrome-shell">
      <!-- Bandeau onglets — zone de déplacement de fenêtre -->
      <div class="tabstrip" id="tabstrip">
        <div class="tabs" id="tabs" role="tablist"></div>
        <button type="button" class="icon-btn tab-add" id="btnNewTab" title="Nouvel onglet (Ctrl+T)" aria-label="Nouvel onglet">
          <svg width="14" height="14" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
        </button>
      </div>

      <!-- Barre d'outils -->
      <div class="toolbar">
        <div class="nav-cluster">
          <button type="button" class="icon-btn" id="btnBack" title="Précédent" aria-label="Précédent">
            <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg>
          </button>
          <button type="button" class="icon-btn" id="btnForward" title="Suivant" aria-label="Suivant">
            <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4.5 13 10l-5.5 5.5"/></svg>
          </button>
          <button type="button" class="icon-btn" id="btnReload" title="Actualiser (Ctrl+R)" aria-label="Actualiser">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 10a6.5 6.5 0 1 1-1.9-4.6M16.5 3.5v3h-3"/></svg>
          </button>
          <button type="button" class="icon-btn" id="btnHome" title="Accueil" aria-label="Accueil">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5 10 3l6.5 5.5V17a1 1 0 0 1-1 1h-4v-5h-3v5h-4a1 1 0 0 1-1-1z"/></svg>
          </button>
        </div>

        <form class="omnibox" id="omniForm">
          <div class="omni-progress-track" id="omniProgress" hidden><div class="omni-progress-bar"></div></div>
          <span class="omni-leading" id="omniIcon" aria-hidden="true">
            <svg class="icon-search" width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="9" cy="9" r="5.5"/><path d="M13.5 13.5 17.5 17.5"/></svg>
            <svg class="icon-lock" width="13" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" hidden><rect x="4" y="8.5" width="12" height="8" rx="2"/><path d="M7 8.5V6.5a3 3 0 0 1 6 0v2"/></svg>
          </span>
          <input id="omni" type="text" spellcheck="false" autocomplete="off" placeholder="Rechercher ou entrer une adresse web" />
          <button type="button" class="omni-action" id="btnOmniFav" title="Ajouter aux favoris (Ctrl+D)" aria-label="Favori">
            <svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M10 3.5l1.9 3.9 4.3.6-3.1 3 .7 4.2L10 13.3l-3.8 2 .7-4.3-3.1-3 4.3-.6z"/></svg>
          </button>
        </form>

        <div class="actions-cluster">
          <span class="inprivate-badge" id="inprivateBadge" hidden>InPrivate</span>
          <button type="button" class="profile-orb" id="btnProfile" title="Profil" aria-label="Profil"><span>A</span></button>
          <button type="button" class="icon-btn menu-trigger" id="btnMenu" aria-haspopup="true" aria-expanded="false" aria-label="Paramètres et plus">
            <svg width="17" height="17" viewBox="0 0 20 20"><circle cx="4" cy="10" r="1.4" fill="currentColor"/><circle cx="10" cy="10" r="1.4" fill="currentColor"/><circle cx="16" cy="10" r="1.4" fill="currentColor"/></svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Menu principal -->
    <nav class="flyout menu-flyout" id="menu" hidden aria-label="Menu">
      <button type="button" data-act="new-tab"><svg class="mi-svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M10 4v12M4 10h12"/></svg>Nouvel onglet<span class="shortcut">Ctrl+T</span></button>
      <button type="button" data-act="new-window"><svg class="mi-svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4.5" width="14" height="11" rx="1.5"/></svg>Nouvelle fenêtre<span class="shortcut">Ctrl+N</span></button>
      <button type="button" data-act="new-private"><svg class="mi-svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="4" y="8.5" width="12" height="8" rx="2"/><path d="M7 8.5V6.5a3 3 0 0 1 6 0v2"/></svg>Nouvelle fenêtre InPrivate<span class="shortcut">Ctrl+Shift+N</span></button>
      <div class="flyout-sep"></div>
      <div class="zoom-row"><span>Zoom</span><div><button type="button" data-act="zoom-out">−</button><em id="zoomLabel">100%</em><button type="button" data-act="zoom-in">+</button></div></div>
      <div class="flyout-sep"></div>
      <button type="button" data-act="favorites"><svg class="mi-svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M10 3.5l1.9 3.9 4.3.6-3.1 3 .7 4.2L10 13.3l-3.8 2 .7-4.3-3.1-3 4.3-.6z"/></svg>Favoris<span class="shortcut">Ctrl+Shift+O</span></button>
      <button type="button" data-act="history"><svg class="mi-svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="10" cy="10" r="7"/><path d="M10 6v4l2.8 1.8"/></svg>Historique<span class="shortcut">Ctrl+H</span></button>
      <button type="button" data-act="tab-groups"><svg class="mi-svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4.5" width="6" height="4.5" rx="1"/><rect x="11" y="4.5" width="6" height="4.5" rx="1"/><rect x="3" y="11" width="6" height="4.5" rx="1"/><rect x="11" y="11" width="6" height="4.5" rx="1"/></svg>Onglets ouverts</button>
      <button type="button" data-act="downloads"><svg class="mi-svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5V13M6 9.5l4 4 4-4M4 16.5h12"/></svg>Téléchargements<span class="shortcut">Ctrl+J</span></button>
      <button type="button" data-act="extensions"><svg class="mi-svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8.2 4.2a1.8 1.8 0 013.6 0V5h3a1 1 0 011 1v3.2h-.8a1.8 1.8 0 000 3.6h.8V16a1 1 0 01-1 1h-3.2v-.8a1.8 1.8 0 00-3.6 0v.8H4.8a1 1 0 01-1-1v-3.2h.8a1.8 1.8 0 000-3.6h-.8V6a1 1 0 011-1h3.4z"/></svg>Extensions</button>
      <button type="button" data-act="passwords"><svg class="mi-svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="4" y="8.5" width="12" height="8" rx="2"/><path d="M7 8.5V6.5a3 3 0 0 1 6 0v2"/></svg>Mots de passe</button>
      <div class="flyout-sep"></div>
      <button type="button" data-act="clear"><svg class="mi-svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 5.5h12M8 5.5V4h4v1.5M6 5.5l.7 10.5h6.6L14 5.5"/></svg>Supprimer les données de navigation</button>
      <button type="button" data-act="print"><svg class="mi-svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 8V3.5h9V8M5.5 14h-2V8.5h13V14h-2M5.5 12h9v5h-9z"/></svg>Imprimer<span class="shortcut">Ctrl+P</span></button>
      <button type="button" data-act="screenshot"><svg class="mi-svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="14" height="10.5" rx="1.5"/><circle cx="10" cy="10" r="2.4"/></svg>Capture d'écran</button>
      <button type="button" data-act="find"><svg class="mi-svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="9" cy="9" r="5.5"/><path d="M13.5 13.5 17.5 17.5"/></svg>Rechercher sur la page<span class="shortcut">Ctrl+F</span></button>
      <div class="flyout-sep"></div>
      <button type="button" data-act="ayebi"><svg class="mi-svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A1.5 1.5 0 015.5 3H16v12.5H5.5A1.5 1.5 0 004 17z"/><path d="M4 15.5A1.5 1.5 0 015.5 14H16M8 7.5h5"/></svg>Ayebi — encyclopédie</button>
      <button type="button" data-act="about"><svg class="mi-svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="10" cy="10" r="7"/><path d="M10 9v4.5M10 6.5h.01"/></svg>À propos d'AYEBA</button>
      <button type="button" data-act="quit"><svg class="mi-svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3.5H5a1.5 1.5 0 0 0-1.5 1.5v10A1.5 1.5 0 0 0 5 16.5h3M13 13l3.5-3-3.5-3M16.5 10H8"/></svg>Quitter AYEBA</button>
    </nav>

    <!-- Profil — rendu dynamique : vrai compte Ayeba (session du site) -->
    <div class="flyout profile-flyout" id="profileFlyout" hidden></div>

    <!-- Favoris (tiroir latéral) -->
    <aside class="drawer favorites-drawer" id="favoritesDrawer" hidden>
      <header>
        <strong>Favoris</strong>
        <div class="drawer-tools">
          <button type="button" class="icon-btn sm" id="favSearch" title="Rechercher"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="9" cy="9" r="5.5"/><path d="M13.5 13.5 17.5 17.5"/></svg></button>
          <button type="button" class="icon-btn sm" id="favAddCurrent" title="Ajouter la page active"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M10 4v12M4 10h12"/></svg></button>
          <button type="button" class="icon-btn sm" id="favoritesClose" title="Fermer"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 5l10 10M15 5 5 15"/></svg></button>
        </div>
      </header>
      <div class="drawer-search" id="favSearchBox" hidden>
        <input type="text" id="favFilter" placeholder="Rechercher dans les favoris…" />
      </div>
      <div class="flyout-body" id="favoritesBody"></div>
    </aside>

    <!-- Panneau central (paramètres, extensions, mots de passe…) -->
    <div class="panel sheet" id="panel" hidden>
      <header><h3 id="panelTitle">Paramètres</h3><button type="button" class="icon-btn" id="panelClose"><svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 5l10 10M15 5 5 15"/></svg></button></header>
      <div class="flyout-body" id="panelBody"></div>
    </div>

    <div class="findbar" id="findbar" hidden>
      <svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" style="opacity:.5"><circle cx="9" cy="9" r="5.5"/><path d="M13.5 13.5 17.5 17.5"/></svg>
      <input id="findInput" type="text" placeholder="Rechercher sur la page…" />
      <span class="find-count" id="findCount"></span>
      <button type="button" id="findPrev" title="Précédent"><svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 7l5 5.5"/></svg></button>
      <button type="button" id="findNext" title="Suivant"><svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7.5 10 13l5-5.5"/></svg></button>
      <button type="button" id="findClose" title="Fermer"><svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 5l10 10M15 5 5 15"/></svg></button>
    </div>

    <script src="./chrome.js"></script>
  </body>
</html>
