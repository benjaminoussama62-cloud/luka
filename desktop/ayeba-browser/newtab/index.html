<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nouvel onglet — AYEBA</title>
    <style>
      :root {
        --ink: #eceef4;
        --muted: rgba(235, 238, 246, 0.6);
        --line: rgba(255, 255, 255, 0.09);
        --accent: #7c5cff;
        --accent-2: #38bdf8;
        --font: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; }
      body {
        min-height: 100vh;
        font-family: var(--font);
        color: var(--ink);
        background: #07080d;
        overflow-x: hidden;
      }

      /* Aurora Ayeba — dégradés locaux, aucune image externe */
      .aurora {
        position: fixed;
        inset: -20%;
        z-index: 0;
        background:
          radial-gradient(ellipse 55% 45% at 18% 8%, rgba(124, 92, 255, 0.28), transparent 62%),
          radial-gradient(ellipse 45% 40% at 85% 18%, rgba(56, 189, 248, 0.2), transparent 60%),
          radial-gradient(ellipse 60% 45% at 55% 95%, rgba(168, 85, 247, 0.14), transparent 62%),
          linear-gradient(180deg, #0a0c13 0%, #07080d 55%, #080910 100%);
        animation: aurora-drift 26s ease-in-out infinite alternate;
      }
      @keyframes aurora-drift {
        from { transform: translate(0, 0) scale(1); }
        to { transform: translate(-1.2%, 1%) scale(1.03); }
      }
      .aurora::after {
        content: "";
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px);
        background-size: 26px 26px;
        mask-image: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent 55%);
      }

      .page {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Barre haute minimale */
      .top-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 22px 0;
      }
      .clock {
        display: flex;
        flex-direction: column;
        line-height: 1.15;
      }
      .clock strong { font-size: 17px; font-weight: 600; letter-spacing: 0.01em; }
      .clock span { font-size: 11.5px; color: var(--muted); text-transform: capitalize; }
      .top-bar .sign-in {
        display: flex;
        align-items: center;
        gap: 7px;
        height: 34px;
        padding: 0 16px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(14px);
        color: var(--ink);
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s, transform 0.12s;
      }
      .top-bar .sign-in:hover { background: rgba(255, 255, 255, 0.12); transform: translateY(-1px); }

      /* Hero */
      .hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: clamp(1.5rem, 6vh, 4.5rem) 1rem 1rem;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 1.75rem;
        animation: rise 0.5s cubic-bezier(0.16, 1, 0.3, 1) backwards;
      }
      .brand-mark {
        width: 52px;
        height: 52px;
        border-radius: 15px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
        color: #fff;
        font-size: 26px;
        font-weight: 800;
        box-shadow: 0 10px 32px rgba(124, 92, 255, 0.4);
      }
      .brand-name {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 0.12em;
        background: linear-gradient(90deg, #fff 30%, rgba(255, 255, 255, 0.65));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .brand-tag {
        font-size: 11.5px;
        color: var(--muted);
        letter-spacing: 0.04em;
        margin-top: -2px;
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: translateY(0); }
      }

      form.search {
        display: flex;
        align-items: center;
        width: min(660px, calc(100% - 2rem));
        height: 52px;
        padding: 0 10px 0 20px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(18, 21, 30, 0.75);
        backdrop-filter: blur(18px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        transition: border-color 0.18s, box-shadow 0.18s, transform 0.15s;
        animation: rise 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.08s backwards;
      }
      form.search:focus-within {
        border-color: rgba(124, 92, 255, 0.6);
        box-shadow: 0 10px 44px rgba(124, 92, 255, 0.25), 0 0 0 3px rgba(124, 92, 255, 0.15);
        transform: translateY(-1px);
      }
      form.search > svg { flex-shrink: 0; opacity: 0.5; margin-right: 12px; }
      form.search input {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: none;
        background: transparent;
        color: var(--ink);
        font-size: 15.5px;
      }
      form.search input::placeholder { color: var(--muted); }
      form.search .go {
        height: 38px;
        padding: 0 20px;
        border: 0;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #fff;
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
        transition: filter 0.14s, transform 0.1s;
        flex-shrink: 0;
      }
      form.search .go:hover { filter: brightness(1.12); }
      form.search .go:active { transform: scale(0.97); }

      /* Tuiles de raccourcis */
      .tiles {
        margin-top: 2rem;
        display: grid;
        grid-template-columns: repeat(auto-fit, 74px);
        justify-content: center;
        gap: 10px;
        max-width: 700px;
        padding: 0 1rem;
        animation: rise 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.16s backwards;
      }
      .tile {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        border: 0;
        background: transparent;
        cursor: pointer;
        text-decoration: none;
        color: inherit;
        transition: transform 0.16s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .tile:hover { transform: translateY(-3px); }
      .tile-box {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid var(--line);
        backdrop-filter: blur(10px);
        font-size: 19px;
        font-weight: 700;
        color: var(--ink);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.07);
        transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
      }
      .tile:hover .tile-box {
        background: rgba(255, 255, 255, 0.12);
        border-color: rgba(124, 92, 255, 0.4);
        box-shadow: 0 8px 24px rgba(124, 92, 255, 0.22);
      }
      .tile-box img { width: 26px; height: 26px; object-fit: contain; }
      .tile-label {
        font-size: 10.5px;
        color: var(--muted);
        max-width: 74px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tile.add .tile-box { border-style: dashed; color: var(--muted); font-weight: 300; font-size: 24px; }

      /* Widgets : météo + marchés */
      .widgets {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 1.75rem;
        flex-wrap: wrap;
        animation: rise 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.24s backwards;
      }
      .widget {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 11px 16px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.055);
        border: 1px solid var(--line);
        backdrop-filter: blur(14px);
        font-size: 12.5px;
        color: var(--muted);
      }
      .widget .w-icon { font-size: 20px; }
      .widget strong { color: var(--ink); font-size: 14px; display: block; }
      .widget .ticker-items { display: flex; gap: 14px; }
      .widget .up { color: #4ade80; }
      .widget .down { color: #f87171; }

      /* Feed */
      .feed-section {
        flex: 1;
        max-width: 1060px;
        width: 100%;
        margin: 2.25rem auto 0;
        padding: 0 20px 26px;
        animation: rise 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.32s backwards;
      }
      .feed-nav {
        display: flex;
        align-items: center;
        gap: 4px;
        padding-bottom: 14px;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .feed-nav::-webkit-scrollbar { display: none; }
      .feed-brand {
        font-weight: 700;
        font-size: 14px;
        margin-right: 12px;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        letter-spacing: 0.02em;
      }
      .feed-nav button[data-cat] {
        flex-shrink: 0;
        height: 31px;
        padding: 0 14px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        font-size: 12.5px;
        cursor: pointer;
        transition: background 0.14s, color 0.14s;
      }
      .feed-nav button[data-cat]:hover { color: var(--ink); background: rgba(255, 255, 255, 0.07); }
      .feed-nav button[data-cat].active {
        background: rgba(124, 92, 255, 0.18);
        color: #d6ccff;
        font-weight: 600;
      }

      .feed-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      @media (max-width: 820px) { .feed-grid { grid-template-columns: 1fr 1fr; } }
      @media (max-width: 540px) { .feed-grid { grid-template-columns: 1fr; } }

      .card {
        position: relative;
        border-radius: 14px;
        overflow: hidden;
        min-height: 150px;
        cursor: pointer;
        border: 1px solid var(--line);
        padding: 0;
        text-align: left;
        background: rgba(20, 24, 34, 0.72);
        backdrop-filter: blur(10px);
        transition: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.18s, border-color 0.18s;
        animation: card-in 0.4s ease backwards;
      }
      .card:nth-child(2) { animation-delay: 0.05s; }
      .card:nth-child(3) { animation-delay: 0.1s; }
      .card:nth-child(4) { animation-delay: 0.14s; }
      .card:nth-child(5) { animation-delay: 0.18s; }
      .card:nth-child(6) { animation-delay: 0.22s; }
      @keyframes card-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .card:hover {
        transform: translateY(-3px);
        border-color: rgba(124, 92, 255, 0.35);
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.45);
      }
      .card-hero { grid-column: span 2; grid-row: span 2; min-height: 300px; }
      @media (max-width: 820px) { .card-hero { grid-column: 1 / -1; grid-row: auto; } }

      .card img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.4s ease;
      }
      .card:hover img { transform: scale(1.045); }
      .card .overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(to top, rgba(5, 7, 12, 0.92) 0%, rgba(5, 7, 12, 0.3) 55%, transparent 100%);
      }
      .card .body { position: absolute; left: 0; right: 0; bottom: 0; padding: 13px 15px; }
      .card-hero .body { padding: 18px 20px; }
      .card .source {
        font-size: 10.5px;
        color: rgba(255, 255, 255, 0.55);
        margin-bottom: 5px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-weight: 600;
      }
      .card h3 {
        font-size: 0.92rem;
        line-height: 1.35;
        font-weight: 600;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .card-hero h3 { font-size: clamp(1.05rem, 2vw, 1.35rem); -webkit-line-clamp: 4; }
      .card.no-img {
        background: linear-gradient(145deg, rgba(30, 34, 52, 0.85), rgba(14, 17, 26, 0.92));
      }

      .skeleton {
        border-radius: 14px;
        background: linear-gradient(90deg, rgba(255,255,255,0.045) 25%, rgba(255,255,255,0.09) 50%, rgba(255,255,255,0.045) 75%);
        background-size: 200% 100%;
        animation: shimmer 1.1s infinite;
        min-height: 150px;
      }
      .skeleton.hero { grid-column: span 2; grid-row: span 2; min-height: 300px; }
      @keyframes shimmer { to { background-position: -200% 0; } }

      .foot {
        padding: 14px;
        text-align: center;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.3);
        letter-spacing: 0.05em;
      }
    </style>
  </head>
  <body>
    <div class="aurora" aria-hidden="true"></div>

    <div class="page">
      <div class="top-bar">
        <div class="clock"><strong id="clockTime">--:--</strong><span id="clockDate"></span></div>
        <button type="button" class="sign-in" data-href="https://ayeba.app/compte">Se connecter</button>
      </div>

      <section class="hero">
        <div class="brand">
          <div class="brand-mark">A</div>
          <div>
            <div class="brand-name">AYEBA</div>
            <div class="brand-tag">Recherche · Ayebi · Écosystème RDC</div>
          </div>
        </div>
        <form class="search" id="searchForm">
          <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="M13.5 13.5 17.5 17.5"/></svg>
          <input id="q" type="search" placeholder="Rechercher avec Ayeba" autofocus />
          <button type="submit" class="go">Rechercher</button>
        </form>
        <div class="tiles" id="shortcuts"></div>
      </section>

      <div class="widgets">
        <div class="widget" id="weather"><span class="w-icon">🌤</span><div><strong>Kinshasa</strong><span id="weatherLine">Chargement…</span></div></div>
        <div class="widget"><div class="ticker-items" id="ticker"><span>Marchés…</span></div></div>
      </div>

      <section class="feed-section">
        <nav class="feed-nav" id="feedNav">
          <span class="feed-brand">Découvrir</span>
          <button type="button" class="active" data-cat="discover">À la une</button>
          <button type="button" data-cat="ayebi">Ayebi</button>
          <button type="button" data-cat="marches">Économie</button>
          <button type="button" data-cat="tech">Tech</button>
          <button type="button" data-cat="sport">Sport</button>
          <button type="button" data-cat="play">Culture</button>
        </nav>
        <div class="feed-grid" id="feedGrid">
          <div class="skeleton hero"></div>
          <div class="skeleton"></div>
          <div class="skeleton"></div>
          <div class="skeleton"></div>
          <div class="skeleton"></div>
        </div>
      </section>

      <div class="foot">AYEBA · navigateur officiel ayeba.app</div>
    </div>

    <script>
      const SHORTCUTS = [
        { name: "Ayeba", href: "https://ayeba.app", logo: "https://ayeba.app/favicon.ico", tint: "linear-gradient(135deg,#7c5cff,#38bdf8)" },
        { name: "Ayebi", href: "https://ayeba.app/ayebi", letter: "A" },
        { name: "Studio", href: "https://ayeba.app/studio", letter: "S", tint: "rgba(124,92,255,.25)" },
        { name: "Marchés", href: "https://ayeba.app/marches", letter: "M", tint: "rgba(56,189,248,.2)" },
        { name: "Jemsa", href: "https://jemsa.net", logo: "https://ayeba.app/brand/shortcuts/jemsa.svg" },
        { name: "Sombateka", href: "https://sombatekaonline.com", logo: "https://ayeba.app/brand/shortcuts/sombateka.png" },
        { name: "Omega", href: "https://omega-web.org", logo: "https://ayeba.app/brand/shortcuts/omega.png" },
        { name: "YouTube", href: "https://youtube.com", logo: "https://www.youtube.com/favicon.ico" },
      ];

      const FEED_QUERIES = {
        discover: "actualités monde aujourd'hui",
        sport: "sport football actualité",
        play: "divertissement culture",
        marches: "marchés bourse économie",
        ayebi: "République Démocratique du Congo",
        tech: "technologie innovation IA",
      };

      /* Tuiles */
      const box = document.getElementById("shortcuts");
      for (const s of SHORTCUTS) {
        const a = document.createElement("a");
        a.className = "tile";
        a.href = s.href;
        a.title = s.name;
        const inner = s.logo
          ? `<img src="${s.logo}" alt="" onerror="this.remove();this.parentNode.textContent='${s.letter || s.name[0]}'"/>`
          : (s.letter || s.name[0]);
        a.innerHTML = `<span class="tile-box" style="${s.tint ? `background:${s.tint}` : ""}">${inner}</span><span class="tile-label">${s.name}</span>`;
        box.appendChild(a);
      }
      const addBtn = document.createElement("button");
      addBtn.type = "button";
      addBtn.className = "tile add";
      addBtn.innerHTML = '<span class="tile-box">+</span><span class="tile-label">Ajouter</span>';
      addBtn.addEventListener("click", () => { window.location.href = "https://ayeba.app/compte"; });
      box.appendChild(addBtn);

      document.querySelectorAll("[data-href]").forEach((el) => {
        el.addEventListener("click", () => { window.location.href = el.dataset.href; });
      });

      /* Horloge réelle */
      function tickClock() {
        const now = new Date();
        document.getElementById("clockTime").textContent = now.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
        document.getElementById("clockDate").textContent = now.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
      }
      tickClock();
      setInterval(tickClock, 15000);

      /* Météo réelle — Open-Meteo (sans clé API) */
      const WMO = { 0: ["☀", "Dégagé"], 1: ["🌤", "Peu nuageux"], 2: ["⛅", "Partiellement nuageux"], 3: ["☁", "Couvert"], 45: ["🌫", "Brouillard"], 48: ["🌫", "Brouillard"], 51: ["🌦", "Bruine"], 53: ["🌦", "Bruine"], 55: ["🌧", "Bruine"], 61: ["🌦", "Pluie légère"], 63: ["🌧", "Pluie"], 65: ["🌧", "Forte pluie"], 80: ["🌦", "Averses"], 81: ["🌧", "Averses"], 82: ["⛈", "Fortes averses"], 95: ["⛈", "Orage"], 96: ["⛈", "Orage grêle"], 99: ["⛈", "Orage grêle"] };
      fetch("https://api.open-meteo.com/v1/forecast?latitude=-4.32&longitude=15.31&current=temperature_2m,weather_code&timezone=Africa%2FKinshasa")
        .then((r) => r.json())
        .then((d) => {
          const t = Math.round(d?.current?.temperature_2m ?? 0);
          const [icon, label] = WMO[d?.current?.weather_code] || ["🌡", "--"];
          document.getElementById("weather").innerHTML =
            `<span class="w-icon">${icon}</span><div><strong>Kinshasa · ${t}°C</strong><span>${label}</span></div>`;
        })
        .catch(() => {
          document.getElementById("weatherLine").textContent = "Hors ligne";
        });

      /* Ticker marchés réel */
      fetch("https://ayeba.app/api/market")
        .then((r) => r.json())
        .then((d) => {
          const q = (d?.quotes || []).slice(0, 5);
          if (!q.length) return;
          document.getElementById("ticker").innerHTML = q
            .map((x) => `<span>${x.label} <span class="${String(x.change || "").startsWith("-") ? "down" : "up"}">${x.value}</span></span>`)
            .join("");
        })
        .catch(() => { document.getElementById("ticker").innerHTML = ""; });

      async function goSearch(q) {
        const query = String(q || "").trim();
        if (!query) return;
        if (/^https?:\/\//i.test(query) || (!query.includes(" ") && query.includes("."))) {
          window.location.href = /^https?:\/\//i.test(query) ? query : `https://${query}`;
          return;
        }
        if (window.ayebaTab?.search) await window.ayebaTab.search(query);
        else window.location.href = `https://ayeba.app/?q=${encodeURIComponent(query)}`;
      }

      document.getElementById("searchForm").addEventListener("submit", (e) => {
        e.preventDefault();
        void goSearch(document.getElementById("q").value);
      });

      function esc(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
      }

      function cardHtml(item, cls) {
        const img = item.image ? `<img src="${esc(item.image)}" alt="" loading="lazy" onerror="this.remove()"/>` : "";
        return `<button type="button" class="card ${cls}${img ? "" : " no-img"}" data-url="${esc(item.url)}">
          ${img}<div class="overlay"></div>
          <div class="body"><div class="source">${esc(item.source || "Ayeba")}</div><h3>${esc(item.title)}</h3></div>
        </button>`;
      }

      function renderGrid(items) {
        const grid = document.getElementById("feedGrid");
        if (!items.length) {
          grid.innerHTML = '<div class="card no-img card-hero" data-url="https://ayeba.app"><div class="overlay"></div><div class="body"><div class="source">Ayeba</div><h3>Explorez le monde entier avec Ayeba</h3></div></div>';
          wireCards();
          return;
        }
        const hero = items[0];
        const rest = items.slice(1, 5);
        let html = cardHtml(hero, "card-hero");
        for (const it of rest) html += cardHtml(it, "");
        grid.innerHTML = html;
        wireCards();
      }

      function wireCards() {
        document.querySelectorAll(".card[data-url]").forEach((el) => {
          el.addEventListener("click", () => { window.location.href = el.dataset.url; });
        });
      }

      async function loadFeed(cat) {
        const grid = document.getElementById("feedGrid");
        grid.innerHTML = '<div class="skeleton hero"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';

        if (cat === "ayebi") {
          try {
            const r = await fetch("https://ayeba.app/api/ayebi/recent");
            const d = await r.json();
            const edits = (d?.edits || []).slice(0, 5);
            if (edits.length) {
              renderGrid(edits.map((e) => ({
                title: e.title || e.slug,
                url: `https://ayeba.app/ayebi/${e.slug}`,
                source: "Ayebi · RDC",
              })));
              return;
            }
          } catch {}
        }

        const q = FEED_QUERIES[cat] || FEED_QUERIES.discover;
        try {
          const r = await fetch("https://ayeba.app/api/search", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: q, zeroAi: true }),
          });
          const d = await r.json();
          const results = (d?.results || []).slice(0, 5);
          if (!results.length) throw new Error("empty");
          renderGrid(results.map((x) => ({
            title: x.title,
            url: x.url,
            source: x.publisher || x.domain || "Web",
            image: x.thumbnail || x.image || "",
          })));
        } catch {
          renderGrid([{
            title: `Explorer : ${q}`,
            url: `https://ayeba.app/?q=${encodeURIComponent(q)}`,
            source: "Ayeba Search",
          }]);
        }
      }

      document.getElementById("feedNav").addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-cat]");
        if (!btn) return;
        document.querySelectorAll("#feedNav button[data-cat]").forEach((b) => b.classList.toggle("active", b === btn));
        void loadFeed(btn.dataset.cat);
      });

      void loadFeed("discover");
    </script>
  </body>
</html>
