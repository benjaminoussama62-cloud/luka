<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nouvel onglet — AYEBA</title>
    <style>
      :root {
        --ink: #f5f5f7;
        --muted: rgba(255, 255, 255, 0.62);
        --line: rgba(255, 255, 255, 0.1);
        --accent: #0078d4;
        --font: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; }
      body {
        min-height: 100vh;
        font-family: var(--font);
        color: var(--ink);
        background: #0a0a0c;
        overflow-x: hidden;
      }

      /* Fond Edge — wallpaper flouté + glow violet */
      .wallpaper {
        position: fixed;
        inset: 0;
        z-index: 0;
        background:
          url("https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=1920&q=80") center/cover no-repeat;
        filter: blur(0px) brightness(0.45) saturate(1.2);
        transform: scale(1.04);
        animation: wp-drift 30s ease-in-out infinite alternate;
      }
      .wallpaper::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 80% 50% at 50% 0%, rgba(134, 97, 197, 0.35), transparent 60%),
          radial-gradient(ellipse 60% 40% at 80% 20%, rgba(0, 120, 212, 0.2), transparent 50%),
          linear-gradient(to bottom, rgba(10, 10, 12, 0.3) 0%, rgba(10, 10, 12, 0.85) 100%);
      }
      @keyframes wp-drift {
        from { transform: scale(1.04) translate(0, 0); }
        to { transform: scale(1.06) translate(-0.5%, -0.3%); }
      }

      .page {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Barre outils haut (Edge) */
      .top-bar {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 6px;
        padding: 16px 24px 0;
      }
      .top-bar button {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 34px;
        padding: 0 14px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(12px);
        color: var(--ink);
        font-size: 12.5px;
        cursor: pointer;
        transition: background 0.15s, transform 0.12s;
      }
      .top-bar button:hover { background: rgba(255, 255, 255, 0.12); transform: translateY(-1px); }
      .top-bar button svg { opacity: 0.75; }
      .top-bar .sign-in {
        background: #fff;
        color: #111;
        border-color: transparent;
        font-weight: 600;
      }
      .top-bar .sign-in:hover { background: #f0f0f0; }

      /* Hero recherche */
      .hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2rem 1rem 1.25rem;
      }

      form.search {
        display: flex;
        align-items: center;
        width: min(680px, calc(100% - 2rem));
        height: 50px;
        padding: 0 8px 0 18px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.97);
        color: #111;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(255, 255, 255, 0.1);
        transition: box-shadow 0.2s, transform 0.15s;
      }
      form.search:focus-within {
        box-shadow: 0 8px 40px rgba(0, 120, 212, 0.3), 0 0 0 2px rgba(0, 120, 212, 0.25);
        transform: translateY(-2px);
      }
      form.search svg { flex-shrink: 0; opacity: 0.4; margin-right: 12px; color: #444; }
      form.search input {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: none;
        background: transparent;
        color: #111;
        font-size: 15px;
      }
      form.search input::placeholder { color: #666; }

      /* Raccourcis circulaires Edge */
      .shortcuts {
        margin-top: 1.5rem;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 1.25rem 1.5rem;
        max-width: 640px;
        padding: 0 1rem;
      }
      .shortcut {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        width: 5rem;
        border: 0;
        background: transparent;
        cursor: pointer;
        text-decoration: none;
        color: inherit;
        transition: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .shortcut:hover { transform: translateY(-4px) scale(1.04); }
      .shortcut-logo {
        width: 3.25rem;
        height: 3.25rem;
        border-radius: 50%;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.14);
        backdrop-filter: blur(8px);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        font-size: 1.1rem;
        font-weight: 700;
      }
      .shortcut-logo img { width: 1.75rem; height: 1.75rem; object-fit: contain; }
      .shortcut-label {
        font-size: 0.68rem;
        font-weight: 500;
        color: var(--muted);
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        text-align: center;
      }
      .shortcut.add .shortcut-logo {
        font-size: 1.5rem;
        font-weight: 300;
        color: var(--muted);
        border-style: dashed;
      }

      /* Feed MSN */
      .feed-section {
        flex: 1;
        max-width: 1200px;
        width: 100%;
        margin: 0 auto;
        padding: 0 20px 20px;
      }

      .feed-nav {
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 12px 0 16px;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .feed-nav::-webkit-scrollbar { display: none; }

      .feed-brand {
        font-weight: 800;
        font-size: 15px;
        letter-spacing: -0.02em;
        margin-right: 16px;
        color: #fff;
        opacity: 0.95;
      }

      .feed-nav button[data-cat] {
        flex-shrink: 0;
        height: 34px;
        padding: 0 16px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        font-size: 13.5px;
        cursor: pointer;
        transition: background 0.14s, color 0.14s;
      }
      .feed-nav button[data-cat]:hover { color: #fff; background: rgba(255, 255, 255, 0.08); }
      .feed-nav button[data-cat].active {
        background: rgba(255, 255, 255, 0.14);
        color: #fff;
        font-weight: 600;
      }

      .feed-tools {
        margin-left: auto;
        display: flex;
        gap: 8px;
        flex-shrink: 0;
      }
      .feed-tools button {
        height: 30px;
        padding: 0 14px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.05);
        color: var(--muted);
        font-size: 12px;
        cursor: pointer;
        transition: background 0.12s;
      }
      .feed-tools button:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }

      /* Grille MSN — hero + colonne + rangée bas */
      .feed-grid {
        display: grid;
        grid-template-columns: 1.55fr 1fr 1fr;
        grid-template-rows: auto auto;
        gap: 10px;
      }
      @media (max-width: 900px) {
        .feed-grid { grid-template-columns: 1fr 1fr; }
        .card-hero { grid-column: 1 / -1; grid-row: auto; min-height: 280px !important; }
      }
      @media (max-width: 560px) {
        .feed-grid { grid-template-columns: 1fr; }
      }

      .card {
        position: relative;
        border-radius: 8px;
        overflow: hidden;
        min-height: 160px;
        cursor: pointer;
        border: 0;
        padding: 0;
        text-align: left;
        background: rgba(30, 30, 35, 0.85);
        backdrop-filter: blur(8px);
        transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s;
        animation: card-in 0.4s ease backwards;
      }
      .card:nth-child(1) { animation-delay: 0.05s; }
      .card:nth-child(2) { animation-delay: 0.1s; }
      .card:nth-child(3) { animation-delay: 0.15s; }
      .card:nth-child(4) { animation-delay: 0.2s; }
      .card:nth-child(5) { animation-delay: 0.25s; }
      .card:nth-child(6) { animation-delay: 0.3s; }
      @keyframes card-in {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .card:hover {
        transform: translateY(-3px) scale(1.01);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      }

      .card-hero {
        grid-row: 1 / 3;
        min-height: 380px;
      }

      .card img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.4s ease;
      }
      .card:hover img { transform: scale(1.04); }

      .card .overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.88) 0%, rgba(0, 0, 0, 0.25) 50%, rgba(0, 0, 0, 0.05) 100%);
      }

      .card .body {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 14px 16px;
      }
      .card-hero .body { padding: 20px 22px; }

      .card .source {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.6);
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-weight: 500;
      }
      .card h3 {
        margin: 0;
        font-size: 0.95rem;
        line-height: 1.35;
        font-weight: 600;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .card-hero h3 {
        font-size: clamp(1.1rem, 2.2vw, 1.5rem);
        -webkit-line-clamp: 4;
        line-height: 1.3;
      }

      .card.no-img {
        background: linear-gradient(145deg, rgba(30, 40, 60, 0.9), rgba(15, 20, 30, 0.95));
      }

      /* Skeleton MSN */
      .skeleton {
        border-radius: 8px;
        background: linear-gradient(90deg, rgba(40, 40, 48, 0.8) 25%, rgba(55, 55, 65, 0.8) 50%, rgba(40, 40, 48, 0.8) 75%);
        background-size: 200% 100%;
        animation: shimmer 1.1s infinite;
        min-height: 160px;
      }
      .skeleton.hero { grid-row: 1 / 3; min-height: 380px; }
      @keyframes shimmer { to { background-position: -200% 0; } }

      /* Ticker marchés */
      .ticker-bar {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        height: 36px;
        border-top: 1px solid var(--line);
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(12px);
        font-size: 0.72rem;
        color: var(--muted);
        overflow: hidden;
        flex-shrink: 0;
      }
      .ticker-bar span { white-space: nowrap; }
      .ticker-bar .up { color: #4ade80; }
      .ticker-bar .down { color: #f87171; }

      /* Widget météo Edge */
      .weather-chip {
        position: fixed;
        bottom: 48px;
        left: 20px;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(16px);
        border: 1px solid var(--line);
        font-size: 13px;
        color: var(--muted);
        cursor: default;
      }
      .weather-chip strong { color: #fff; font-size: 15px; }
    </style>
  </head>
  <body>
    <div class="wallpaper" aria-hidden="true"></div>

    <div class="page">
      <div class="top-bar">
        <button type="button" id="btnEdit" title="Modifier">
          <svg width="14" height="14" viewBox="0 0 16 16"><path fill="currentColor" d="M11.5 1.5l3 3L5 14H2v-3z"/></svg>
          Modifier
        </button>
        <button type="button" id="btnPageSettings" title="Paramètres de page">
          <svg width="14" height="14" viewBox="0 0 16 16"><path fill="currentColor" d="M8 1l1.2 2.5 2.7.4-2 1.9.5 2.7L8 7.5 5.6 8.5l.5-2.7-2-1.9 2.7-.4z"/></svg>
          Paramètres de page
        </button>
        <button type="button" class="sign-in" data-href="https://ayeba.app/compte">Se connecter</button>
      </div>

      <section class="hero">
        <form class="search" id="searchForm">
          <svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M7 2a5 5 0 1 1 0 10A5 5 0 0 1 7 2m0-1a6 6 0 1 0 3.6 10.8l3.4 3.4.7-.7-3.4-3.4A6 6 0 0 0 7 1"/></svg>
          <input id="q" type="search" placeholder="Rechercher sur le web" autofocus />
        </form>
        <div class="shortcuts" id="shortcuts"></div>
      </section>

      <section class="feed-section">
        <nav class="feed-nav" id="feedNav">
          <span class="feed-brand">ayeba</span>
          <button type="button" class="active" data-cat="discover">Découvrir</button>
          <button type="button" data-cat="sport">Sport</button>
          <button type="button" data-cat="play">Divertissement</button>
          <button type="button" data-cat="marches">Argent</button>
          <button type="button" data-cat="ayebi">Ayebi</button>
          <button type="button" data-cat="tech">Tech</button>
          <button type="button" data-cat="watch">Vidéos</button>
          <div class="feed-tools">
            <button type="button" id="btnLayout">Disposition du fil</button>
            <button type="button" id="btnPersonalize">Personnaliser</button>
          </div>
        </nav>
        <div class="feed-grid" id="feedGrid">
          <div class="skeleton hero"></div>
          <div class="skeleton"></div>
          <div class="skeleton"></div>
          <div class="skeleton"></div>
          <div class="skeleton"></div>
        </div>
      </section>

      <div class="ticker-bar" id="ticker" aria-live="polite"></div>
    </div>

    <div class="weather-chip" id="weather">
      <span>☀</span>
      <div><strong>Kinshasa</strong><br/>Chargement…</div>
    </div>

    <script>
      const SHORTCUTS = [
        { name: "Ayebi", href: "https://ayeba.app/ayebi", letter: "A", tint: "#1a1520" },
        { name: "Ayeba", href: "https://ayeba.app", logo: "https://ayeba.app/favicon.ico" },
        { name: "YouTube", href: "https://youtube.com", logo: "https://www.youtube.com/favicon.ico" },
        { name: "Google", href: "https://google.com", logo: "https://www.google.com/favicon.ico" },
        { name: "GitHub", href: "https://github.com", logo: "https://github.com/favicon.ico" },
        { name: "Jemsa", href: "https://jemsa.net", logo: "https://ayeba.app/brand/shortcuts/jemsa.svg" },
        { name: "Sombateka", href: "https://sombatekaonline.com", logo: "https://ayeba.app/brand/shortcuts/sombateka.png" },
        { name: "Omega", href: "https://omega-web.org", logo: "https://ayeba.app/brand/shortcuts/omega.png" },
      ];

      const FEED_QUERIES = {
        discover: "actualités monde aujourd'hui",
        sport: "sport football actualité",
        play: "divertissement culture",
        marches: "marchés bourse économie",
        ayebi: "République Démocratique du Congo",
        tech: "technologie innovation IA",
        watch: "vidéo documentaire",
      };

      const box = document.getElementById("shortcuts");
      for (const s of SHORTCUTS) {
        const a = document.createElement("a");
        a.className = "shortcut";
        a.href = s.href;
        a.title = s.name;
        const inner = s.logo
          ? `<img src="${s.logo}" alt="" onerror="this.remove();this.parentNode.textContent='${s.letter || s.name[0]}'"/>`
          : (s.letter || s.name[0]);
        a.innerHTML = `<span class="shortcut-logo" style="${s.tint ? `background:${s.tint}` : ""}">${inner}</span><span class="shortcut-label">${s.name}</span>`;
        box.appendChild(a);
      }
      const addBtn = document.createElement("button");
      addBtn.type = "button";
      addBtn.className = "shortcut add";
      addBtn.innerHTML = '<span class="shortcut-logo">+</span><span class="shortcut-label">Ajouter</span>';
      addBtn.addEventListener("click", () => { window.location.href = "https://ayeba.app/compte"; });
      box.appendChild(addBtn);

      document.querySelectorAll("[data-href]").forEach((el) => {
        el.addEventListener("click", () => { window.location.href = el.dataset.href; });
      });

      fetch("https://ayeba.app/api/market")
        .then((r) => r.json())
        .then((d) => {
          const q = (d?.quotes || []).slice(0, 6);
          document.getElementById("ticker").innerHTML = q
            .map((x) => `<span>${x.label} <span class="${String(x.change || "").startsWith("-") ? "down" : "up"}">${x.value}</span></span>`)
            .join("");
        })
        .catch(() => {});

      document.getElementById("weather").innerHTML = "<span>🌤</span><div><strong>Kinshasa</strong><br/>28°C · Ensoleillé</div>";

      async function goSearch(q) {
        const query = String(q || "").trim();
        if (!query) return;
        if (/^https?:\/\//i.test(query) || (!query.includes(" ") && query.includes("."))) {
          window.location.href = /^https?:\/\//i.test(query) ? query : `https://${query}`;
          return;
        }
        if (window.ayebaTab?.search) await window.ayebaTab.search(query);
        else window.location.href = `https://ayeba.app/?q=${encodeURIComponent(query)}`;
      }

      document.getElementById("searchForm").addEventListener("submit", (e) => {
        e.preventDefault();
        void goSearch(document.getElementById("q").value);
      });

      function esc(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
      }

      function cardHtml(item, cls) {
        const img = item.image ? `<img src="${esc(item.image)}" alt="" loading="lazy" onerror="this.remove()"/>` : "";
        return `<button type="button" class="card ${cls}${img ? "" : " no-img"}" data-url="${esc(item.url)}">
          ${img}<div class="overlay"></div>
          <div class="body"><div class="source">${esc(item.source || "Ayeba")}</div><h3>${esc(item.title)}</h3></div>
        </button>`;
      }

      function renderGrid(items) {
        const grid = document.getElementById("feedGrid");
        if (!items.length) {
          grid.innerHTML = '<div class="card no-img card-hero" data-url="https://ayeba.app"><div class="overlay"></div><div class="body"><div class="source">Ayeba</div><h3>Explorez le monde entier avec Ayeba</h3></div></div>';
          wireCards();
          return;
        }
        const hero = items[0];
        const topRight = items.slice(1, 3);
        const bottom = items.slice(3, 6);
        let html = cardHtml(hero, "card-hero");
        for (const it of topRight) html += cardHtml(it, "");
        for (const it of bottom) html += cardHtml(it, "");
        grid.innerHTML = html;
        wireCards();
      }

      function wireCards() {
        document.querySelectorAll(".card[data-url]").forEach((el) => {
          el.addEventListener("click", () => { window.location.href = el.dataset.url; });
        });
      }

      async function loadFeed(cat) {
        const grid = document.getElementById("feedGrid");
        grid.innerHTML = '<div class="skeleton hero"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';

        if (cat === "ayebi") {
          try {
            const r = await fetch("https://ayeba.app/api/ayebi/recent");
            const d = await r.json();
            const edits = (d?.edits || []).slice(0, 6);
            if (edits.length) {
              renderGrid(edits.map((e) => ({
                title: e.title || e.slug,
                url: `https://ayeba.app/ayebi/${e.slug}`,
                source: "Ayebi · RDC",
              })));
              return;
            }
          } catch {}
        }

        const q = FEED_QUERIES[cat] || FEED_QUERIES.discover;
        try {
          const r = await fetch("https://ayeba.app/api/search", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: q, zeroAi: true }),
          });
          const d = await r.json();
          const results = (d?.results || []).slice(0, 6);
          if (!results.length) throw new Error("empty");
          renderGrid(results.map((x) => ({
            title: x.title,
            url: x.url,
            source: x.publisher || x.domain || "Web",
            image: x.thumbnail || x.image || "",
          })));
        } catch {
          renderGrid([{
            title: `Explorer : ${q}`,
            url: `https://ayeba.app/?q=${encodeURIComponent(q)}`,
            source: "Ayeba Search",
          }]);
        }
      }

      document.getElementById("feedNav").addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-cat]");
        if (!btn) return;
        document.querySelectorAll("#feedNav button[data-cat]").forEach((b) => b.classList.toggle("active", b === btn));
        void loadFeed(btn.dataset.cat);
      });

      ["btnEdit", "btnPageSettings", "btnLayout", "btnPersonalize"].forEach((id) => {
        document.getElementById(id)?.addEventListener("click", () => {
          window.location.href = "https://ayeba.app/compte";
        });
      });

      void loadFeed("discover");
    </script>
  </body>
</html>
