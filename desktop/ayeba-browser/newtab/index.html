<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nouvel onglet — AYEBA</title>
    <style>
      :root {
        --ink: #f5f5f7;
        --muted: #9aa0ae;
        --cyan: #00b4ff;
        --orange: #e85d04;
        --font: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; min-height: 100%; font-family: var(--font); color: var(--ink);
        background: #050507;
      }
      body {
        min-height: 100vh;
        display: flex; flex-direction: column;
        background:
          radial-gradient(900px 480px at 18% 8%, rgba(0,180,255,0.18), transparent 60%),
          radial-gradient(720px 440px at 88% 18%, rgba(232,93,4,0.14), transparent 55%),
          #050507;
      }
      .main {
        flex: 1;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 2rem 1rem 1rem;
      }
      .brand {
        margin: 0;
        font-size: clamp(3rem, 10vw, 5rem);
        font-weight: 800;
        letter-spacing: -0.045em;
        text-shadow: 0 0 48px rgba(0,180,255,0.5);
      }
      .quote { margin: 0.4rem 0 1.5rem; color: var(--orange); font-style: italic; font-size: 1.05rem; }
      form.search {
        display: flex; align-items: center; gap: 0;
        width: min(640px, 100%); height: 52px;
        padding: 0 0.35rem 0 1rem;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(255,255,255,0.05);
        backdrop-filter: blur(16px);
      }
      form.search:focus-within {
        border-color: rgba(0,180,255,0.5);
        box-shadow: 0 0 0 3px rgba(0,180,255,0.12);
      }
      form.search svg { flex-shrink: 0; opacity: 0.5; margin-right: 0.65rem; }
      form.search input {
        flex: 1; min-width: 0; border: 0; outline: none; background: transparent;
        color: var(--ink); font-size: 15px;
      }
      form.search button {
        height: 40px; padding: 0 1.2rem; border: 0; border-radius: 999px;
        background: #fff; color: #0b0b0f; font-weight: 700; font-size: 0.7rem;
        letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer;
      }
      .shortcuts {
        margin-top: 1.75rem;
        display: flex; flex-wrap: wrap; justify-content: center; gap: 1.1rem;
        max-width: 520px;
      }
      .shortcut {
        display: flex; flex-direction: column; align-items: center; gap: 0.45rem;
        width: 5.25rem; border: 0; background: transparent; cursor: pointer;
        text-decoration: none; color: inherit;
      }
      .shortcut-logo {
        width: 3rem; height: 3rem; border-radius: 50%;
        display: grid; place-items: center; overflow: hidden;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.1);
      }
      .shortcut-logo img { width: 1.65rem; height: 1.65rem; object-fit: contain; }
      .shortcut-label {
        font-size: 0.68rem; font-weight: 600; color: var(--muted);
        max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .ticker {
        height: 36px; display: flex; align-items: center; justify-content: center;
        border-top: 1px solid rgba(255,255,255,0.06);
        background: rgba(0,0,0,0.35);
        font-size: 0.72rem; color: var(--muted);
        gap: 1.5rem; overflow: hidden;
      }
      .ticker span { white-space: nowrap; }
    </style>
  </head>
  <body>
    <div class="main">
      <h1 class="brand">AYEBA</h1>
      <p class="quote">Le monde entier, une requête.</p>
      <form class="search" id="searchForm">
        <svg width="18" height="18" viewBox="0 0 16 16" aria-hidden><path fill="currentColor" d="M7 2a5 5 0 1 1 0 10A5 5 0 0 1 7 2m0-1a6 6 0 1 0 3.6 10.8l3.4 3.4.7-.7-3.4-3.4A6 6 0 0 0 7 1"/></svg>
        <input id="q" type="search" placeholder="Rechercher le monde entier…" autofocus />
        <button type="submit">Rechercher</button>
      </form>
      <div class="shortcuts" id="shortcuts"></div>
    </div>
    <div class="ticker" id="ticker" aria-live="polite"></div>
    <script>
      const SHORTCUTS = [
        { name: "Ayebi", href: "https://ayeba.app/ayebi", logo: "", letter: "A", tint: "#1c1917" },
        { name: "Jemsa", href: "https://jemsa.net", logo: "https://ayeba.app/brand/shortcuts/jemsa.svg" },
        { name: "Sombateka", href: "https://sombatekaonline.com", logo: "https://ayeba.app/brand/shortcuts/sombateka.png" },
        { name: "DevAlpha", href: "https://devalpha1.com", logo: "https://ayeba.app/brand/shortcuts/devalpha1.svg" },
        { name: "Tala", href: "https://to-tala.com", logo: "https://ayeba.app/brand/shortcuts/tala.svg" },
        { name: "Omega", href: "https://omega-web.org", logo: "https://ayeba.app/brand/shortcuts/omega.png" },
      ];
      const box = document.getElementById("shortcuts");
      for (const s of SHORTCUTS) {
        const a = document.createElement("a");
        a.className = "shortcut";
        a.href = s.href;
        a.title = s.name;
        const inner = s.logo
          ? `<img src="${s.logo}" alt="" onerror="this.remove();this.parentNode.textContent='${s.letter || s.name[0]}'"/>`
          : (s.letter || s.name[0]);
        a.innerHTML = `<span class="shortcut-logo" style="${s.tint ? `background:${s.tint}` : ""}">${inner}</span><span class="shortcut-label">${s.name}</span>`;
        box.appendChild(a);
      }
      fetch("https://ayeba.app/api/market")
        .then((r) => r.json())
        .then((d) => {
          const q = (d?.quotes || []).slice(0, 4);
          document.getElementById("ticker").innerHTML = q.map((x) => `<span>${x.label} ${x.value}</span>`).join("");
        })
        .catch(() => {});
      async function goSearch(q) {
        const query = String(q || "").trim();
        if (!query) return;
        if (/^https?:\/\//i.test(query) || (!query.includes(" ") && query.includes("."))) {
          window.location.href = /^https?:\/\//i.test(query) ? query : `https://${query}`;
          return;
        }
        if (window.ayebaTab?.search) await window.ayebaTab.search(query);
        else window.location.href = `https://ayeba.app/?q=${encodeURIComponent(query)}`;
      }
      document.getElementById("searchForm").addEventListener("submit", (e) => {
        e.preventDefault();
        void goSearch(document.getElementById("q").value);
      });
    </script>
  </body>
</html>
