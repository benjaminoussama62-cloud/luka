<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nouvel onglet — AYEBA</title>
    <style>
      :root {
        --ink: #f5f5f7;
        --muted: #9aa0ae;
        --cyan: #00b4ff;
        --orange: #e85d04;
        --font: "Segoe UI", Inter, system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; font-family: var(--font); color: var(--ink); background: #050507; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1rem 3rem;
        background:
          radial-gradient(900px 480px at 18% 8%, rgba(0,180,255,0.2), transparent 60%),
          radial-gradient(720px 440px at 88% 18%, rgba(232,93,4,0.18), transparent 55%),
          #050507;
      }
      .wrap { width: min(760px, 100%); text-align: center; }
      .brand {
        margin: 0;
        font-size: clamp(3.2rem, 11vw, 5.8rem);
        font-weight: 800;
        letter-spacing: -0.045em;
        text-shadow: 0 0 48px rgba(0,180,255,0.55);
      }
      .quote { margin: 0.45rem 0 1.7rem; color: var(--orange); font-style: italic; font-size: 1.08rem; }
      form {
        display: flex; gap: 0.55rem; align-items: center; height: 58px;
        padding: 0 0.45rem 0 1.1rem; border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.05);
        backdrop-filter: blur(16px); box-shadow: 0 18px 44px rgba(0,0,0,0.38);
      }
      form:focus-within {
        border-color: rgba(0,180,255,0.55);
        box-shadow: 0 0 0 3px rgba(0,180,255,0.14), 0 18px 44px rgba(0,0,0,0.38);
      }
      input {
        flex: 1; min-width: 0; border: 0; outline: none; background: transparent;
        color: var(--ink); font-size: 16px;
      }
      button[type="submit"] {
        height: 44px; padding: 0 1.15rem; border: 0; border-radius: 999px;
        background: #fff; color: #0b0b0f; font-weight: 800; letter-spacing: 0.07em;
        text-transform: uppercase; font-size: 0.72rem; cursor: pointer;
      }
      .tiles {
        margin: 1.65rem auto 0; display: grid;
        grid-template-columns: repeat(4, 108px); justify-content: center; gap: 0.9rem;
        width: max-content; max-width: 100%;
      }
      @media (max-width: 520px) {
        .tiles { grid-template-columns: repeat(2, 108px); }
      }
      .tile {
        width: 108px; height: 116px; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 0.5rem; border: 0;
        border-radius: 18px; background: linear-gradient(180deg, #fff, #f2f4f8);
        box-shadow: 0 12px 28px rgba(0,0,0,0.3); cursor: pointer; text-decoration: none; color: #0f172a;
        transition: transform 0.18s ease;
      }
      .tile:hover { transform: translateY(-3px); }
      .logo {
        width: 46px; height: 46px; border-radius: 12px; overflow: hidden;
        display: grid; place-items: center; background: #111; color: #fff; font-weight: 800;
      }
      .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .name {
        width: 90%; font-size: 0.64rem; font-weight: 800; letter-spacing: 0.02em;
        text-transform: uppercase; line-height: 1.15;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        min-height: 1.9rem;
      }
      .foot { margin-top: 1.9rem; color: var(--muted); font-size: 0.78rem; }
    </style>
  </head>
  <body>
    <main class="wrap">
      <h1 class="brand">AYEBA</h1>
      <p class="quote">Le monde entier, une requête.</p>
      <form id="searchForm">
        <input id="q" type="search" placeholder="Rechercher le monde entier…" autofocus />
        <button type="submit">Rechercher</button>
      </form>
      <div class="tiles" id="tiles"></div>
      <p class="foot">Navigateur Ayeba · onglets Chromium · ayeba.app</p>
    </main>
    <script>
      const SHORTCUTS = [
        { name: "JEMSA", href: "https://jemsa.net", logo: "https://ayeba.app/brand/shortcuts/jemsa.svg", tint: "#2563eb", letter: "J" },
        { name: "SOMBATEKAONLE", href: "https://sombatekaonline.com", logo: "https://ayeba.app/brand/shortcuts/sombateka.png", tint: "#0f766e", letter: "S" },
        { name: "DEVALPHA1", href: "https://devalpha1.com", logo: "https://ayeba.app/brand/shortcuts/devalpha1.svg", tint: "#dc2626", letter: "D" },
        { name: "TALA", href: "https://to-tala.com", logo: "https://ayeba.app/brand/shortcuts/tala.svg", tint: "#ca8a04", letter: "T" },
      ];
      const tiles = document.getElementById("tiles");
      for (const s of SHORTCUTS) {
        const a = document.createElement("a");
        a.className = "tile";
        a.href = s.href;
        a.title = s.name;
        a.innerHTML = `<span class="logo" style="background:${s.tint}"><img src="${s.logo}" alt="" onerror="this.remove();this.parentNode.textContent='${s.letter}'"/></span><span class="name">${s.name}</span>`;
        tiles.appendChild(a);
      }
      document.getElementById("searchForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const q = document.getElementById("q").value.trim();
        if (!q) return;
        if (/^https?:\/\//i.test(q) || (!q.includes(" ") && q.includes("."))) {
          window.location.href = /^https?:\/\//i.test(q) ? q : `https://${q}`;
          return;
        }
        window.location.href = `https://ayeba.app/?q=${encodeURIComponent(q)}`;
      });
    </script>
  </body>
</html>
