<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050507" />
    <title>AYEBA</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: #050507;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2.2rem;
        font-family: system-ui, -apple-system, sans-serif;
        animation: body-in 0.5s ease;
      }
      @keyframes body-in { from { opacity: 0; } }

      /* ── Cadre arrondi : ligne lumineuse degradee qui le trace en tournant ── */
      .loader { position: relative; width: 132px; height: 132px; }
      .loader svg.trace { position: absolute; inset: 0; }
      .trace rect {
        fill: none;
        stroke: url(#lg);
        stroke-width: 4;
        stroke-linecap: round;
        stroke-dasharray: 340 920;
        animation: trace 1.6s linear infinite;
      }
      @keyframes trace { to { stroke-dashoffset: -1260; } }
      .loader .faint {
        fill: none;
        stroke: rgba(0, 180, 255, 0.12);
        stroke-width: 4;
      }
      /* Le A fixe au centre, degrade cyan->orange */
      .loader .letter {
        position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
        font-size: 58px; font-weight: 650;
        background: linear-gradient(160deg, #7df0ff 0%, #00b4ff 45%, #e85d04 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .word {
        font-size: 1.15rem; font-weight: 300;
        letter-spacing: 0.55em; text-indent: 0.55em;
        color: #d2dce7;
      }
    </style>
  </head>
  <body>
    <div class="loader">
      <svg class="trace" viewBox="0 0 132 132">
        <defs>
          <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#7df0ff"/>
            <stop offset="55%" stop-color="#00b4ff"/>
            <stop offset="100%" stop-color="#e85d04"/>
          </linearGradient>
        </defs>
        <rect class="faint" x="10" y="10" width="112" height="112" rx="26"/>
        <rect x="10" y="10" width="112" height="112" rx="26"/>
      </svg>
      <div class="letter">A</div>
    </div>
    <div class="word">AYEBA</div>
    <div id="err" style="display:none;max-width:320px;text-align:center"></div>
    <script>
      var TARGET = "https://ayeba.app/?app=1";
      var started = Date.now();
      var MIN_ANIM = 1100;

      function showError(msg) {
        var el = document.getElementById("err");
        el.style.display = "block";
        el.innerHTML =
          '<div style="font-size:.95rem;color:#f87171;margin-bottom:6px">Connexion impossible</div>' +
          '<div style="font-size:.75rem;color:#8a94a6;margin-bottom:18px">' + msg + "</div>" +
          '<button onclick="location.reload()" style="background:linear-gradient(90deg,#00b4ff,#e85d04);' +
          'border:0;border-radius:20px;padding:10px 28px;color:#fff;font-size:.9rem;cursor:pointer">Réessayer</button>';
      }

      // Diagnostic : on teste vraiment la connectivite AVANT de naviguer,
      // pour afficher la vraie erreur au lieu de la page generique.
      function go() {
        var wait = Math.max(0, MIN_ANIM - (Date.now() - started));
        setTimeout(function () {
          var ctrl = new AbortController();
          var to = setTimeout(function () { ctrl.abort(); }, 9000);
          fetch("https://ayeba.app/favicon.ico?diag=" + Date.now(), {
            mode: "no-cors",
            cache: "no-store",
            signal: ctrl.signal,
          })
            .then(function () {
              clearTimeout(to);
              location.replace(TARGET);
            })
            .catch(function (e) {
              clearTimeout(to);
              showError(e && e.name === "AbortError" ? "Délai dépassé — vérifie ta connexion." : "Réseau inaccessible : " + (e && e.message ? e.message : "erreur inconnue"));
            });
        }, wait);
      }

      if (document.readyState === "complete") go();
      else window.addEventListener("load", go);
    </script>
  </body>
</html>
