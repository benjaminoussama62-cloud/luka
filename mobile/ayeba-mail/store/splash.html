<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background:
      radial-gradient(ellipse 90% 70% at 50% 38%, rgba(0,180,255,0.10) 0%, transparent 60%),
      linear-gradient(160deg, #0a0a0e 0%, #050507 55%, #0b0d16 100%);
    font-family: "Segoe UI", Arial, sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(125,240,255,0.05) 1.5px, transparent 1.5px);
    background-size: 4.2vmin 4.2vmin;
  }
  .icon {
    width: 26vmin; height: 26vmin; border-radius: 6vmin;
    background: linear-gradient(135deg, #0a0a0e 0%, #12141c 100%);
    border: 0.5vmin solid rgba(0,180,255,0.35);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 8vmin rgba(0,180,255,0.20), inset 0 0 4vmin rgba(0,0,0,0.55);
  }
  .icon svg { width: 70%; height: 70%; }
  h1 {
    margin-top: 5.5vmin;
    font-size: 8.5vmin; font-weight: 800; letter-spacing: 0.6vmin;
    color: #f2f4f8;
  }
  h1 .mail {
    background: linear-gradient(100deg, #7df0ff 0%, #00b4ff 55%, #e85d04 115%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .kicker {
    margin-top: 2.2vmin;
    font-size: 2.6vmin; font-weight: 600; letter-spacing: 0.9vmin;
    color: #7df0ff; text-transform: uppercase; opacity: 0.85;
  }
</style>
</head>
<body>
  <div class="dots"></div>
  <div class="icon">
    <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="g" x1="20%" y1="10%" x2="80%" y2="90%">
          <stop offset="0%" stop-color="#7df0ff"/>
          <stop offset="45%" stop-color="#00b4ff"/>
          <stop offset="100%" stop-color="#e85d04"/>
        </linearGradient>
      </defs>
      <rect x="104" y="158" width="304" height="196" rx="30" fill="none" stroke="url(#g)" stroke-width="24"/>
      <path d="M118 182 L256 296 L394 182" fill="none" stroke="url(#g)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <h1>AYEBA <span class="mail">MAIL</span></h1>
  <div class="kicker">Messagerie sécurisée</div>
</body>
</html>
