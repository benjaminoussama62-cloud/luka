<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050507">
  <meta name="color-scheme" content="dark">
  <title>Ayeba Mbongo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #050507; }
    body {
      display: flex; align-items: center; justify-content: center;
      font-family: "Segoe UI", system-ui, sans-serif; color: #e8eaf0;
    }
    .ring {
      width: 64px; height: 64px; border-radius: 50%;
      border: 2px solid rgba(0,180,255,.25); border-top-color: #00b4ff;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="ring" role="progressbar" aria-label="Chargement d'Ayeba Mbongo"></div>
</body>
</html>
