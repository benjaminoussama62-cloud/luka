name: Build Ayeba Mail Android AAB

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/ayeba-mail/**"
      - ".github/workflows/android-aab-mail.yml"

jobs:
  build-aab:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile/ayeba-mail

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/ayeba-mail/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install deps & Capacitor sync
        run: |
          npm install
          npx cap sync android
          node scripts/patch-android.js

      - name: Prepare upload keystore (même clé que l'app Ayeba)
        env:
          KS_B64: ${{ secrets.AYEBA_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.AYEBA_KEYSTORE_PASS }}
        run: |
          test -n "$KS_B64" || { echo "Missing AYEBA_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$KS_PASS" || { echo "Missing AYEBA_KEYSTORE_PASS secret"; exit 1; }
          PASS="$KS_PASS"
          echo "$KS_B64" | base64 -d > ayeba-upload.keystore
          echo "Keystore loaded from GitHub secret."
          keytool -list -v -keystore ayeba-upload.keystore -storepass "$PASS" 2>/dev/null | grep "SHA1:" || true
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=ayeba\nstoreFile=../ayeba-upload.keystore\n' "$PASS" "$PASS" > android/keystore.properties

      - name: Build release AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
          AYEBA_VERSION: "1.0.1"
          AYEBA_VERSION_CODE: "2"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyebaMail-PlayStore-aab
          path: mobile/ayeba-mail/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Publish AAB on GitHub Releases (download sans login)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mail-1.0.1
          name: Ayeba Mail 1.0.1
          body: |
            Fichier Play Store : **app-release.aab** → renommer `AyebaMail-1.0.1.aab` (API 35)
            Package : `app.ayeba.mail` — versionCode 2
          files: mobile/ayeba-mail/android/app/build/outputs/bundle/release/app-release.aab
          overwrite_files: true
