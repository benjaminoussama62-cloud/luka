name: AYEBA Browser Windows

on:
  push:
    tags:
      - "browser-v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/ayeba-browser/package-lock.json

      - name: Install dependencies
        working-directory: desktop/ayeba-browser
        run: npm ci

      - name: Build NSIS installer
        working-directory: desktop/ayeba-browser
        run: npm run dist
        env:
          # Signature du code : ajouter les secrets CSC_LINK (PFX base64) et
          # CSC_KEY_PASSWORD dans GitHub → Settings → Secrets. Si absents,
          # le build n'est pas signé (pas d'échec). Voir docs/code-signing-windows.md
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Build portable ZIP
        working-directory: desktop/ayeba-browser
        run: npm run dist:portable
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/browser-v')
        with:
          files: |
            desktop/ayeba-browser/dist/AYEBA-Setup-*.exe
            desktop/ayeba-browser/dist/AYEBA-Setup-*.exe.blockmap
            desktop/ayeba-browser/dist/AYEBA-Portable-*.zip
            desktop/ayeba-browser/dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
