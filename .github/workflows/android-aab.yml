name: Build AYEBA Android AAB

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/ayeba-app/**"
      - ".github/workflows/android-aab.yml"

jobs:
  build-aab:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile/ayeba-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/ayeba-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install deps & Capacitor sync
        run: |
          npm install
          npx cap sync android
          node scripts/patch-android.js

      - name: Create upload keystore
        env:
          KS_PASS: ${{ secrets.AYEBA_KEYSTORE_PASS }}
        run: |
          PASS="${KS_PASS:-ayeba2026}"
          keytool -genkeypair -v \
            -keystore ayeba-upload.keystore \
            -alias ayeba \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Ayeba, OU=Mobile, O=Ayeba, L=Kinshasa, ST=Kinshasa, C=CD"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=ayeba\nstoreFile=../ayeba-upload.keystore\n' "$PASS" "$PASS" > android/keystore.properties

      - name: Build release AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: AYEBA-PlayStore-aab
          path: mobile/ayeba-app/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Publish AAB on GitHub Releases (download sans login)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-1.0.0
          name: AYEBA Mobile 1.0.0
          body: |
            Fichier Play Store : **AYEBA-1.0.0.aab** (~2,5 Mo)
            Package : `app.ayeba.mobile`
          files: mobile/ayeba-app/android/app/build/outputs/bundle/release/app-release.aab
          overwrite_files: true
