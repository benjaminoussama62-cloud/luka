name: Build Ayeba Mbongo Android AAB

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/ayeba-mbongo/**"
      - ".github/workflows/android-aab-mbongo.yml"

jobs:
  build-aab:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile/ayeba-mbongo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # SDK Android préinstallé sur ubuntu-latest — on complète avec la plateforme 36.
      - name: Accept SDK licenses & install platform 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Install deps & Capacitor sync
        run: |
          npm install --no-package-lock
          npm run build:offline
          npx cap sync android
          node scripts/patch-android.js

      - name: Prepare upload keystore (clé de signature Mbongo)
        env:
          KS_B64: ${{ secrets.MBONGO_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.MBONGO_KEYSTORE_PASS }}
        run: |
          test -n "$KS_B64" || { echo "Missing MBONGO_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$KS_PASS" || { echo "Missing MBONGO_KEYSTORE_PASS secret"; exit 1; }
          echo "$KS_B64" | base64 -d > mbongo-upload.keystore
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=ayeba-money\nstoreFile=../mbongo-upload.keystore\n' "$KS_PASS" "$KS_PASS" > android/keystore.properties
          echo "Keystore loaded from GitHub secret."

      - name: Build release AAB + APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --stacktrace
        env:
          AYEBA_VERSION: "1.0.0"
          AYEBA_VERSION_CODE: "2"

      - name: Upload AAB + APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AyebaMbongo-PlayStore-aab
          path: |
            mobile/ayeba-mbongo/android/app/build/outputs/bundle/release/app-release.aab
            mobile/ayeba-mbongo/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Publish AAB + APK on GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mbongo-1.0.0
          name: Ayeba Mbongo 1.0.0
          body: |
            Fichier Play Store : **app-release.aab** → renommer `AyebaMbongo-1.0.0.aab`
            Test direct : **app-release.apk** → installer sur Android
            Package : `app.ayeba.mbongo` — app Capacitor (splash animé, zéro barre Chrome)
          files: |
            mobile/ayeba-mbongo/android/app/build/outputs/bundle/release/app-release.aab
            mobile/ayeba-mbongo/android/app/build/outputs/apk/release/app-release.apk
          overwrite_files: true
