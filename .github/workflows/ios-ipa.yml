name: Build AYEBA iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/ayeba-app/**"
      - ".github/workflows/ios-ipa.yml"

jobs:
  build-ipa:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile/ayeba-app

    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (iOS 26+ SDK requis par ASC)
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/ayeba-app/package-lock.json

      - name: Install deps & Capacitor sync
        run: |
          npm install
          npx cap sync ios

      - name: Install CocoaPods dependencies
        run: |
          cd ios/App
          pod install --repo-update

      # ── Signature — secrets GitHub requis pour l'IPA App Store ──
      #   IOS_P12_B64 / IOS_P12_PASSWORD / IOS_PROFILE_B64 / IOS_TEAM_ID
      #   APP_STORE_CONNECT_KEY_ID / ISSUER_ID / P8_B64 → upload TestFlight
      # Sans ces secrets : build non signé (validation compile uniquement).
      - name: Import signing assets (si secrets présents)
        id: signing
        env:
          P12_B64: ${{ secrets.IOS_P12_B64 }}
          P12_PASS: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROFILE_B64 }}
        run: |
          if [ -z "$P12_B64" ]; then echo "signed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "$P12_B64" | base64 -d > signing.p12 || { echo "::error::decode IOS_P12_B64"; exit 1; }
          echo "$PROFILE_B64" | base64 -d > profile.mobileprovision || { echo "::error::decode IOS_PROFILE_B64"; exit 1; }
          wc -c signing.p12 profile.mobileprovision
          echo "== diag: validite du p12 + mot de passe =="
          openssl pkcs12 -in signing.p12 -passin "pass:$P12_PASS" -clcerts -nokeys 2>/dev/null \
            | openssl x509 -noout -subject -dates \
            || { echo "::error::P12 illisible ou mot de passe incorrect (IOS_P12_PASSWORD)"; exit 1; }
          echo "== diag: contenu du profil =="
          security cms -D -i profile.mobileprovision -o /tmp/prof.plist \
            || { echo "::error::profil .mobileprovision illisible (IOS_PROFILE_B64)"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :Name" -c "Print :Entitlements:application-identifier" /tmp/prof.plist \
            || { echo "::error::profil decodable mais champs absents"; exit 1; }
          security create-keychain -p ci build.keychain \
            || { echo "::error::create-keychain"; exit 1; }
          security default-keychain -s build.keychain || { echo "::error::default-keychain"; exit 1; }
          security unlock-keychain -p ci build.keychain || { echo "::error::unlock-keychain"; exit 1; }
          if ! security import signing.p12 -k build.keychain -P "$P12_PASS" \
            -T /usr/bin/codesign -T /usr/bin/security; then
            echo "import direct ko — normalisation du p12 en format Apple (PBE-SHA1-3DES)"
            openssl pkcs12 -in signing.p12 -passin "pass:$P12_PASS" -nodes -legacy > /tmp/id.pem 2>/dev/null \
              || openssl pkcs12 -in signing.p12 -passin "pass:$P12_PASS" -nodes > /tmp/id.pem
            openssl pkcs12 -export -in /tmp/id.pem -out signing_compat.p12 \
              -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1 \
              -passout "pass:$P12_PASS" -legacy 2>/dev/null \
              || openssl pkcs12 -export -in /tmp/id.pem -out signing_compat.p12 \
                -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1 \
                -passout "pass:$P12_PASS"
            security import signing_compat.p12 -k build.keychain -P "$P12_PASS" \
              -T /usr/bin/codesign -T /usr/bin/security \
              || { echo "::error::import p12 (direct + compat) — mot de passe/cle invalide"; exit 1; }
          fi
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain \
            || { echo "::error::set-key-partition-list"; exit 1; }
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/ \
            || { echo "::error::copie profil"; exit 1; }

      - name: Archive (signée si secrets, sinon compile-check)
        run: |
          cd ios/App
          XCB_ARGS="-workspace App.xcworkspace -scheme App -configuration Release -archivePath ../AYEBA.xcarchive"
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            xcodebuild archive $XCB_ARGS \
              > ../xcodebuild.log 2>&1 || XCB_FAILED=1
          else
            xcodebuild archive $XCB_ARGS \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO > ../xcodebuild.log 2>&1 || XCB_FAILED=1
          fi
          tail -30 ../xcodebuild.log
          if [ "$XCB_FAILED" = "1" ]; then
            grep -E "error:|fatal error" ../xcodebuild.log | head -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Upload log xcodebuild (si echec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ayeba-xcodebuild-log
          path: |
            mobile/ayeba-app/ios/xcodebuild.log
            mobile/ayeba-app/ios/export.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Export IPA (si signé)
        if: steps.signing.outputs.signed == 'true'
        run: |
          cd ios/App
          cat > export.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${{ secrets.IOS_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict>
              <key>app.ayeba.mobile</key><string>AYEBA App Store</string>
            </dict>
            <key>uploadBitcode</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath ../AYEBA.xcarchive \
            -exportPath ../export \
            -exportOptionsPlist export.plist > ../export.log 2>&1 \
            || { tail -40 ../export.log; exit 1; }
          ls -la ../export/

      - name: Upload IPA artifact
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AYEBA-AppStore-ipa
          path: mobile/ayeba-app/ios/export/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload vers App Store Connect / TestFlight
        if: steps.signing.outputs.signed == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_P8: ${{ secrets.APP_STORE_CONNECT_P8_B64 }}
        run: |
          if [ -z "$ASC_KEY_ID" ]; then
            echo "::warning::Aucun secret APP_STORE_CONNECT_* — IPA dispo en artefact, PAS d'upload TestFlight"
            exit 0
          fi
          cd ios/App
          echo "$ASC_P8" | base64 -d > "AuthKey_$ASC_KEY_ID.p8" \
            || { echo "::error::decode APP_STORE_CONNECT_P8_B64"; exit 1; }
          python3 - <<'PYEOF'
          import json, os
          key = open(f"AuthKey_{os.environ['ASC_KEY_ID']}.p8").read()
          json.dump({
            "key_id": os.environ["ASC_KEY_ID"],
            "issuer_id": os.environ["ASC_ISSUER"],
            "key": key,
            "in_house": False,
          }, open("../asc_key.json", "w"))
          PYEOF
          IPA=$(ls ../export/*.ipa | head -1)
          echo "Upload $IPA vers TestFlight (key $ASC_KEY_ID)…"
          fastlane pilot upload \
            --ipa "$IPA" \
            --api_key_path ../asc_key.json \
            --skip_waiting_for_build_processing > ../pilot.log 2>&1 \
            || {
              tail -40 ../pilot.log
              grep -iE "error|invalid|unauthorized|forbidden|denied|failed" ../pilot.log | head -15 | while IFS= read -r line; do
                echo "::error::$line"
              done
              exit 1
            }

      - name: Upload xcarchive (compile-check sans secrets)
        if: steps.signing.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AYEBA-xcarchive-unsigned
          path: mobile/ayeba-app/ios/AYEBA.xcarchive/Products/Applications/*.app
          retention-days: 14
