name: Build Ayeba Mail iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/ayeba-mail/**"
      - ".github/workflows/ios-ipa-mail.yml"

jobs:
  build-ipa:
    runs-on: macos-26
    defaults:
      run:
        working-directory: mobile/ayeba-mail

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/ayeba-mail/package-lock.json

      - name: Install deps, bundle offline app & Capacitor sync
        run: |
          npm install
          npm run build:offline
          npx cap sync ios

      - name: Install CocoaPods dependencies
        run: |
          cd ios/App
          pod install --repo-update

      # ── Signature — secrets GitHub requis pour l'IPA App Store ──
      #   IOS_P12_B64          certificat distribution (.p12 en base64)
      #   IOS_P12_PASSWORD     mot de passe du .p12
      #   IOS_MAIL_PROFILE_B64 profil App Store app.ayeba.mail (.mobileprovision b64)
      #   IOS_TEAM_ID          Apple Team ID (10 caractères)
      #   APP_STORE_CONNECT_KEY_ID / APP_STORE_CONNECT_ISSUER_ID /
      #   APP_STORE_CONNECT_P8_B64  → upload TestFlight via xcrun altool/notarytool
      # Sans ces secrets : build non signé (validation compile uniquement).
      - name: Import signing assets (si secrets présents)
        id: signing
        env:
          P12_B64: ${{ secrets.IOS_P12_B64 }}
          P12_PASS: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_MAIL_PROFILE_B64 }}
        run: |
          if [ -z "$P12_B64" ]; then echo "signed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "$P12_B64" | base64 -d > signing.p12
          echo "$PROFILE_B64" | base64 -d > profile.mobileprovision
          echo "== diag: validite du p12 + mot de passe =="
          openssl pkcs12 -in signing.p12 -passin "pass:$P12_PASS" -clcerts -nokeys 2>/dev/null \
            | openssl x509 -noout -subject -dates \
            || { echo "::error::P12 illisible ou mot de passe incorrect (IOS_P12_PASSWORD)"; exit 1; }
          echo "== diag: contenu du profil =="
          security cms -D -i profile.mobileprovision -o /tmp/prof.plist
          /usr/libexec/PlistBuddy -c "Print :Name" -c "Print :Entitlements:application-identifier" /tmp/prof.plist
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          if ! security import signing.p12 -k build.keychain -P "$P12_PASS" \
            -T /usr/bin/codesign -T /usr/bin/security; then
            echo "import direct ko — normalisation du p12 en format Apple (PBE-SHA1-3DES)"
            openssl pkcs12 -in signing.p12 -passin "pass:$P12_PASS" -nodes -legacy > /tmp/id.pem 2>/dev/null \
              || openssl pkcs12 -in signing.p12 -passin "pass:$P12_PASS" -nodes > /tmp/id.pem
            openssl pkcs12 -export -in /tmp/id.pem -out signing_compat.p12 \
              -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1 \
              -passout "pass:$P12_PASS" -legacy 2>/dev/null \
              || openssl pkcs12 -export -in /tmp/id.pem -out signing_compat.p12 \
                -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1 \
                -passout "pass:$P12_PASS"
            security import signing_compat.p12 -k build.keychain -P "$P12_PASS" \
              -T /usr/bin/codesign -T /usr/bin/security
          fi
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Archive (signée si secrets, sinon compile-check)
        run: |
          cd ios/App
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            xcodebuild archive \
              -workspace App.xcworkspace -scheme App \
              -configuration Release \
              -archivePath ../AyebaMail.xcarchive \
              > ../archive.log 2>&1 || {
                tail -40 ../archive.log
                grep -iE "error:|fatal error|requires|failed" ../archive.log | head -20 | while IFS= read -r line; do
                  echo "::error::$line"
                done
                exit 1
              }
          else
            xcodebuild archive \
              -workspace App.xcworkspace -scheme App \
              -configuration Release \
              -archivePath ../AyebaMail.xcarchive \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
              > ../archive.log 2>&1 || { tail -40 ../archive.log; exit 1; }
          fi

      - name: Export IPA (si signé)
        if: steps.signing.outputs.signed == 'true'
        run: |
          cd ios/App
          cat > export.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${{ secrets.IOS_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>app.ayeba.mail</key><string>Ayeba Mail App Store</string></dict>
            <key>uploadBitcode</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath ../AyebaMail.xcarchive \
            -exportPath ../export \
            -exportOptionsPlist export.plist > ../export.log 2>&1 \
            || { tail -40 ../export.log; exit 1; }
          ls -la ../export/

      - name: Upload IPA artifact
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AyebaMail-AppStore-ipa
          path: mobile/ayeba-mail/ios/export/*.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Upload TestFlight (si cle API App Store Connect)
        if: steps.signing.outputs.signed == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_P8_B64: ${{ secrets.APP_STORE_CONNECT_P8_B64 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_P8_B64" ]; then
            echo "pas de cle API ASC — telechargez l'artifact IPA et uploadez manuellement"
            exit 0
          fi
          mkdir -p ~/.private_keys
          echo "$ASC_P8_B64" | base64 -d > "$HOME/.private_keys/AuthKey_${ASC_KEY_ID}.p8"
          jq -n --arg k "$ASC_KEY_ID" --arg i "$ASC_ISSUER" \
            --rawfile p8 "$HOME/.private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            '{key_id:$k, issuer_id:$i, key:$p8}' > /tmp/asc-key.json
          IPA=$(ls ios/export/*.ipa | head -1)
          echo "Upload $IPA vers App Store Connect..."
          UPLOAD_OK=0
          if command -v fastlane >/dev/null 2>&1; then
            fastlane pilot upload \
              --api_key_path /tmp/asc-key.json \
              --ipa "$IPA" \
              --skip_submission true \
              --skip_waiting_for_build_processing true \
              > /tmp/pilot.log 2>&1 || UPLOAD_OK=1
          else
            xcrun altool --upload-app --type ios --file "$IPA" \
              --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER" \
              > /tmp/pilot.log 2>&1 || UPLOAD_OK=1
          fi
          if [ "$UPLOAD_OK" = "1" ]; then
            tail -35 /tmp/pilot.log
            grep -iE "error|invalid|unauthor|forbidden|missing|denied|expired" /tmp/pilot.log \
              | head -15 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          tail -15 /tmp/pilot.log

      - name: Upload logs xcodebuild (si echec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ayeba-mail-xcodebuild-logs
          path: |
            mobile/ayeba-mail/ios/archive.log
            mobile/ayeba-mail/ios/export.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload xcarchive (compile-check sans secrets)
        if: steps.signing.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AyebaMail-xcarchive-unsigned
          path: mobile/ayeba-mail/ios/AyebaMail.xcarchive/Products/Applications/*.app
          retention-days: 14
